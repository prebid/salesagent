# A model is serialized at the edges and nowhere else (salesagent-3cs7o.12).
#
# A model is the value; a dict built from it mid-flow is a second representation that drifts
# (CLAUDE.md critical pattern 4). The edges where a model legitimately becomes bytes each have
# one owner: the wire (`src/core/tools/_wire.to_wire`), outbound HTTP to another agent or a
# webhook target (the agent registries and the webhook services), the idempotency payload hash,
# the persistence edge (the engine's JSON serializer behind the JSONType column, the ORM
# @validates hooks in json_validators.py, and the documents repositories and the context
# manager compose or compare), the admin UI's JSON responses, and the ONE schema module that
# re-dumps a nested child inside the one serializer seat. Every other `.model_dump(...)` /
# `.model_dump_json(...)` under src/ is a finding. pricing.py was a second exempt schema
# module until the validator that dumped an SDK pricing option to revalidate it was deleted;
# no production path produced an SDK-typed option, so the exemption lost its subject
# (salesagent-3cs7o.32).
#
# WHY AST-GREP AND NOT RUFF. TID251 bans a NAME that is imported, and a method call on an
# instance imports nothing: `req.model_dump()` reaches for no module. The ban has to fall on
# the CALL SITE, which is a structural fact only a syntax rule can state. The companion ruff
# ban in ruff-serialization.toml covers the bare-call spellings that ARE names --
# `pydantic_core.to_jsonable_python` and `pydantic_core.to_json` -- with the same edge list,
# because `to_jsonable_python(creative.assets)` once escaped a guard that only knew the
# attribute spelling.
#
# The edges are excluded by PATH, never by a suppression comment, and the list is the same
# one the ruff config carries. A new edge is a new entry here and there, in one change.
#
# This rule replaces tests/unit/test_architecture_no_model_dump_in_impl.py, which walked the
# AST from `*_impl` entrypoints under src/core/tools and saw only calls named model_dump; a
# call reached through a helper outside that walk, or spelled to_jsonable_python, was a hole.
id: serialize-only-at-the-edges
language: Python
severity: error
message: >-
  A model is serialized only at an edge: the wire (to_wire), an outbound body, the idempotency
  hash, the persistence edge, or the admin UI's JSON. Hand the model through instead of
  dumping it (CLAUDE.md pattern 4, salesagent-3cs7o.12).
files:
  - "src/**/*.py"
ignores:
  - "src/core/tools/_wire.py"
  - "src/core/idempotency_canonical.py"
  - "src/core/creative_agent_registry.py"
  - "src/core/signals_agent_registry.py"
  - "src/services/protocol_webhook_service.py"
  - "src/services/webhook_delivery_service.py"
  # The RFC 9421 layer brought two more OUTBOUND-BODY edges with it, each with one owner:
  # trust_root.py composes the PUBLISHED JWKS and brand.json documents (a third party
  # fetches them, so the dump IS the wire), and notification_proof_service.py composes the
  # activation-challenge body it sends to the buyer's webhook target. Listed as edges
  # rather than suppressed at the call site, which is what this rule requires, and mirrored
  # in ruff-serialization.toml in the same change.
  - "src/core/signing/trust_root.py"
  - "src/services/notification_proof_service.py"
  - "src/core/webhooks/registration.py"
  - "src/core/errors/issues.py"
  - "src/core/errors/details.py"
  - "src/core/database/repositories/**"
  - "src/core/database/database_session.py"
  - "src/core/context_manager.py"
  - "src/core/json_validators.py"
  - "src/admin/**"
  - "src/core/schemas/_base.py"
rule:
  any:
    - pattern: $X.model_dump($$$)
    - pattern: $X.model_dump_json($$$)
    # pydantic v1's spelling of model_dump, still callable on every model; it escaped the
    # first cut of this rule in src/adapters/xandr.py. `.json()` is deliberately NOT here:
    # it is also the name of every HTTP response body accessor.
    - pattern: $X.dict($$$)
