# One producer for the credential headers a test presents to this seller.
#
# WHY A RULE AND NOT A GUARD TEST. Ruff's TID251 bans imports and attributes, which is
# why the egress precedent works -- it bans importing httpx -- and why it cannot work
# here: every site is a dict-key string literal in a `dict[str, str]`, so there is
# nothing for ruff or mypy to see. The check is structural, so a structural matcher owns
# it. `make quality-ci` runs the scan; tests/unit/test_ast_grep_credential_header_ban.py
# grades that the rule fires on every shape this tree contains.
#
# WHY RELATIONAL AND NOT FOUR LITERAL PATTERNS. `pattern: '{"Authorization": $V}'`
# matches a SINGLE-PAIR dict only, so a headers dict that also carries Content-Type or
# x-adcp-tenant escapes, and a literal pattern is case-sensitive so the lowercase
# spelling escapes too. Measured: the literal form caught 24 of 38 construction sites,
# including six the migration lists as MIGRATE. Asking for a dictionary that HAS a pair
# whose key matches the header, case-insensitively, catches all of them.
id: test-credential-header-single-producer
language: Python
severity: error
message: >-
  Credential header built inline. Call credential_headers() from tests/helpers/credentials.py
  (or env.credential() inside a harness env) -- one producer, so a change in what production
  reads off the wire is one edit. Outbound seller->buyer credentials and tests where the header IS
  the subject are exempt: put an ast-grep-ignore comment naming this rule and the reason
  on the line above, and record the file in the ban's companion test.
files:
  - "tests/**/*.py"
rule:
  any:
    # A dict literal carrying the header as a key. Not `inside` a comparison: an
    # `assert headers == {"Authorization": ...}` is an ASSERTION about what a producer
    # emitted, not a second producer. Including those takes the population from 38 to
    # 117 and would force a third of the rule's own matches onto exemptions -- growth
    # into an allowlist, which is the direction allowlists must never move.
    - kind: dictionary
      has:
        kind: pair
        has:
          field: key
          regex: '(?i)^"?(authorization|x-adcp-auth)"?$'
      not:
        inside:
          kind: comparison_operator
          stopBy:
            kind: dictionary
    # `headers["Authorization"] = ...`. The assignment is what makes it construction;
    # a subscript READ of the same key is extraction, which the auth tests do legitimately.
    - kind: subscript
      inside:
        kind: assignment
        field: left
      has:
        field: subscript
        regex: '(?i)^"?(authorization|x-adcp-auth)"?$'
