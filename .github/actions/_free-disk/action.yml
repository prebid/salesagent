name: Free disk space
description: >-
  Reclaim ubuntu-latest headroom before heavy Docker/compose builds
  (unused preinstalled toolchains + Docker builder cache).
inputs:
  min-free-gib:
    description: Fail when free space after reclaim is below this many GiB.
    required: false
    default: "8"
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        # -x traces the reclaim. pipefail matches the other shell bodies under .github/.
        set -euo pipefail
        set -x
        min_gib="${{ inputs.min-free-gib }}"
        if ! [[ "$min_gib" =~ ^[0-9]+$ ]]; then
          echo "min-free-gib must be a non-negative integer, got: ${min_gib}" >&2
          exit 1
        fi
        avail() { df -B1 --output=avail / | tail -1; }
        before="$(avail)"
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/share/boost \
          /usr/share/swift \
          || true
        docker builder prune -af 2>/dev/null || true
        after="$(avail)"
        # Gate on space left, not bytes deleted. A runner that was already
        # roomy reclaims little and must still pass; one left under the floor
        # must fail even if the rm list deleted a lot.
        min=$((min_gib * 1024 * 1024 * 1024))
        echo "free ${before} -> ${after} bytes, floor ${min}" >&2
        if (( after < min )); then
          echo "free space ${after} bytes, below ${min}" >&2
          exit 1
        fi
