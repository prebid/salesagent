name: Free runner disk
description: >
  Remove the hosted runner's preinstalled toolchains these jobs never use. On a pull
  request the pinned creative agent is built from source, and its build context alone is
  about 3.8 GB, so a runner with less free disk than usual fails the build with
  "no space left on device" before any test starts.
runs:
  using: composite
  steps:
    - name: Remove unused toolchains
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
        df -h /
