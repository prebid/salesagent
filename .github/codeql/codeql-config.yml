name: salesagent CodeQL config

# security-extended adds OWASP Top-10 + CWE coverage on top of the default suite.
# Queries run in advisory mode during the 2-week ramp (see codeql.yml).
queries:
  - uses: security-extended

# py/log-injection (CWE-117) is excluded because the guarantee lives in the logging
# configuration, where CodeQL cannot see it: every handler the app configures uses
# JSONFormatter (production) or LineSafeFormatter (development, and the adcp.audit /
# adcp.oauth handlers in both modes), so no record can span more than one line
# whatever a call site interpolates. tests/unit/test_log_safe.py::
# TestEveryHandlerWritesOneLinePerRecord sends records carrying every line-break
# character through Logger.handle in both modes and fails if any handler writes more
# than one line. Change a handler's formatter and that test is what tells you.
query-filters:
  - exclude:
      id: py/log-injection

# Exclude generated / vendored / migration content from analysis to reduce noise.
# Code Quality (github-code-quality[bot]) is configured at the org/repo level — its
# path scope must mirror paths-ignore here. See docs/development/ci-pipeline.md
# § "GitHub Code Quality vs CodeQL scoping" (#1422).
paths-ignore:
  - alembic/versions/
  - tests/
  - htmlcov/
  - .venv/
