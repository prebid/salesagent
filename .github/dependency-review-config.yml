# Extracted config for actions/dependency-review-action (PR 6 of #1234).
fail-on-severity: moderate
comment-summary-in-pr: on-failure
deny-licenses:
  - GPL-3.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0
  - AGPL-3.0-only
  - AGPL-3.0-or-later
# pylint is GPL-2.0-or-later. It is declared only in the `dev` dependency group, and the
# image installs with `uv sync --no-dev`, so it is never distributed.
allow-dependencies-licenses:
  - pkg:pypi/pylint
