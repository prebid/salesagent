name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  # One run per PR head ref; a superseded push cancels the in-flight run.
  # push/dispatch events get per-sha groups so runs on main never cancel or
  # queue behind each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql://adcp_user:test_password@127.0.0.1:5432/adcp_test
  GEMINI_API_KEY: test_key_for_mocking
  GOOGLE_CLIENT_ID: test_client_id
  GOOGLE_CLIENT_SECRET: test_client_secret
  SUPER_ADMIN_EMAILS: test@example.com
  ADCP_TESTING: true
  ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      # check_type_ignore_count.py compares .type-ignore-baseline against
      # origin/main and hard-fails when the ref is missing; the shallow
      # checkout above doesn't bring it in.
      - name: Fetch origin/main for baseline ratchet comparison
        run: git fetch origin main --depth=1
      - name: Run static analysis (make quality-ci)
        run: make quality-ci

  # mypy also runs inside Quality Gate via `make quality-ci` (the unified local
  # target — removing it there would drift local from CI). The dedicated job is
  # kept as a separate required-check signal; jobs run in parallel, so the
  # overlap costs runner minutes, not wall-clock time.
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - name: Run mypy
        run: make typecheck

  schema-contract:
    name: Schema Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/unit/test_adcp_contract.py
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/integration/test_mcp_contract_validation.py
          extra_args: -v --tb=short

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - name: Run security audit
        run: ./scripts/security-audit.sh

  quickstart:
    name: Quickstart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Start services with docker compose
        run: docker compose up -d --wait --wait-timeout 120
      - name: Verify health endpoint
        run: curl -f http://localhost:8000/health
      - name: Cleanup
        if: always()
        run: docker compose down -v

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/smoke/
          tb: short
          extra_args: -v

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 15 was enough while the six storyboard structural guards SKIPPED for want
    # of a pinned tree. Provisioning the release bundle below un-skips 25 of
    # them, and they parse all 121 pinned storyboards — the job went 9m38s ->
    # over 15m and was cancelled at the ceiling. Raised with headroom rather
    # than trimmed, because the point of provisioning the tree is that these
    # guards actually run.
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      # The storyboard structural guards resolve the pinned AdCP tree via
      # storyboard_spec.adcp_home(), which prefers this extracted release
      # bundle. Without it they skip, which silently disabled 23 guards in every
      # unit run — they all pass once a tree is actually resolvable.
      - uses: ./.github/actions/_adcp-bundle
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/unit/ tests/harness/
          with_coverage: "true"
          # Run the unit suite the way the runner does. Without these three
          # flags this job cannot observe the failure it is meant to gate:
          # `--json-report` is the discriminator (pytest-json-report attaches
          # log-record dicts that execnet's exact-type dispatch refuses), `-n`
          # is what puts a wire between the test and the report at all, and
          # `--dist loadgroup` is what makes the `xdist_group` marker on the
          # nested-pytest modules mean anything. Serially, all three are inert
          # and a green run here says nothing about the parallel one.
          # The JSON file is not consumed; producing it is the point.
          extra_args: -n auto --dist loadgroup --json-report --json-report-file=unit-ci.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-coverage
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error

  integration-tests:
    name: Integration (${{ matrix.group }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull adcp-creative-agent from ghcr.io (publish runs on main via publish-creative-agent.yml)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: creative
            marker: creative
          - group: product
            marker: product and not creative
          - group: media-buy
            marker: (media_buy or delivery) and not creative and not product
          - group: infra
            marker: (transport or auth or adapter or schema or admin or infra or inventory or targeting or workflow or policy or agent) and not creative and not product and not media_buy and not delivery
          - group: other
            marker: not (creative or product or media_buy or delivery or transport or auth or adapter or schema or admin or infra or inventory or targeting or workflow or policy or agent)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adcp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adcp_test
        options: >-
          --health-cmd "pg_isready -U adcp_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: ./.github/actions/_postgres
        with:
          database-url: ${{ env.DATABASE_URL }}
      - name: Log in to GitHub Container Registry
        if: matrix.group == 'creative'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start pinned creative agent
        id: creative_agent
        if: matrix.group == 'creative'
        env:
          CREATIVE_AGENT_GHCR_IMAGE: ghcr.io/${{ github.repository }}/adcp-creative-agent
        run: ./scripts/creative-agent-stack.sh up
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/integration/
          disable_randomly: "true"
          extra_args: --timeout=60 -m "(${{ matrix.marker }}) and not skip_ci"
        env:
          CREATIVE_AGENT_URL: ${{ steps.creative_agent.outputs.url }}
          # The pinned creative agent is reached over https through its own TLS
          # front (scripts/creative-agent-stack.sh, salesagent-40qh) at a
          # reserved loopback address, which the egress seam refuses on the
          # ADDRESS count. run_all_tests_host.sh and the e2e compose files
          # already open this hatch; this group is driven directly by the
          # action, so it needs it too — without it the group goes red the
          # moment the MCP client validates its agent URL (salesagent-jl08).
          ADCP_OUTBOUND_ALLOW_PRIVATE: ${{ matrix.group == 'creative' && 'true' || '' }}
          # Trust both the private leaf (creative-agent-stack.sh's TLS front)
          # and real public roots — the private-CA-only file broke `uv sync`
          # against pypi.org during salesagent-40qh's own verification.
          SSL_CERT_FILE: ${{ matrix.group == 'creative' && format('{0}/.test-tls/combined-ca.pem', github.workspace) || '' }}
      - name: Cleanup pinned creative agent
        if: always() && matrix.group == 'creative'
        run: ./scripts/creative-agent-stack.sh down

  e2e-tests:
    # CI owns build+up (with healthchecks); pytest only verifies.
    # Do NOT clear ADCP_TESTING — empty forces docker_services_e2e into the
    # standalone cold-build path under pytest --timeout=300 (setup ENOSPC/timeouts).
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull adcp-creative-agent from ghcr.io (publish runs on main via publish-creative-agent.yml)
    # 40m: pre-start compose --wait + migrations + pytest bodies; 25m too tight.
    timeout-minutes: 40
    env:
      # Native compose multi-file (colon-separated). Overlay sites inherit this;
      # cascading single-file downs keep an explicit -f (intentional scopes).
      COMPOSE_FILE: docker-compose.e2e.yml:docker-compose.e2e.ports.yml
      POSTGRES_PORT: 5435
      ADCP_SALES_PORT: 8080
      ADCP_TLS_PORT: 8443
      WEBHOOK_CAPTURE_PORT: 8090
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure docker-compose alias exists
        run: |
          docker compose version
          echo '#!/bin/bash' | sudo tee /usr/local/bin/docker-compose
          echo 'exec docker compose "$@"' | sudo tee -a /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
      # Image build + compose layers need headroom on ubuntu-latest.
      - name: Free disk space
        uses: ./.github/actions/_free-disk
      - name: Clean up lingering containers
        run: |
          docker ps -q | xargs -r docker kill || true
          docker compose down -v 2>/dev/null || true
          docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true
      - name: Build and start E2E stack
        env:
          ADCP_TESTING: "true"
          # Prefer pin-keyed GHCR pull in creative-agent-stack.sh build (CI owns
          # the only cold-build path under ADCP_TESTING=true verify-only pytest).
          CREATIVE_AGENT_GHCR_IMAGE: ghcr.io/${{ github.repository }}/adcp-creative-agent
        run: |
          set -eux
          # tls-proxy bind-mounts .test-tls/; generate material before compose build/up.
          ./scripts/dev/ensure-test-tls.sh
          ./scripts/creative-agent-stack.sh build
          # COMPOSE_FILE (job env) overlays e2e + e2e.ports for host curl/pytest.
          docker compose build
          # --wait gates postgres, creative-agent, adcp-server, proxy healthchecks
          # (creative-agent hard gate for all E2E). Budget covers migrations.
          docker compose \
            up -d --wait --wait-timeout 600
          curl -sf "http://127.0.0.1:${ADCP_SALES_PORT}/health"
          docker compose ps
      # No coverage: the server under test runs inside Docker, so host-side
      # coverage would measure the client harness, not src/.
      # --timeout=300 + timeout_func_only=true: bodies only. CI pre-start above
      # owns creative-agent build + compose up --wait + migrations; with
      # ADCP_TESTING=true the session fixture is verify-only (no cold build).
      # Job timeout-minutes covers a hung pre-start; do not resurrect fixture
      # cold-build narratives here. Pin ADCP_TESTING on this step — do not rely
      # on workflow-env inheritance alone.
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/e2e/
          extra_args: --timeout=300 -o timeout_func_only=true
        env:
          DATABASE_URL: ""
          ADCP_TESTING: "true"
      - name: Cleanup Docker services
        if: always()
        run: |
          docker compose down -v 2>/dev/null || true
          docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true

  bdd-in-network:
    # The 5th BDD transport (e2e_rest: real HTTP through nginx to the live
    # server, serial, BDD_E2E_ENABLED=true from docker-compose.e2e.yml) — the
    # only job that grades the e2e_rest known-failures ledger. Without it a
    # ledger graduation (or regression) is invisible to CI: the sharded BDD
    # job runs in-process transports only (PR #1430 review). This job runs
    # ONLY the bdd_e2e tox env (-k e2e_rest): re-running the in-process bulk
    # here would duplicate the sharded job serially for no added grading.
    name: BDD In-Network (e2e_rest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull adcp-creative-agent from ghcr.io (publish runs on main via publish-creative-agent.yml)
    # The full serial all-transports run measured 44m of pytest; the e2e_rest
    # leg alone is the minority of that. Keep 75m until the leg-only runtime
    # is measured, then ratchet the timeout down.
    timeout-minutes: 75
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Image build + /opt/venv + second full tox env under tox_data
      # overflowed ubuntu-latest (~14GB free) → ENOSPC on uv sync into /app/.tox.
      - name: Free disk space
        uses: ./.github/actions/_free-disk
      - name: Clean up lingering containers
        run: |
          docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          docker network prune -f 2>/dev/null || true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No _setup-env / host Postgres: the runner container executes tox inside
      # the compose network (postgres:5432, proxy:8000) and publishes no host
      # ports. No coverage upload: the suite asserts behavior on the live
      # server; host-side coverage would measure the client harness, not src/.
      - name: Run BDD suite in-network
        run: ./run_all_tests.sh bdd_e2e
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          # run_all_tests.sh builds the pinned creative agent host-side; prefer
          # the pin-keyed ghcr pull (~5m faster) over building from source.
          CREATIVE_AGENT_GHCR_IMAGE: ghcr.io/${{ github.repository }}/adcp-creative-agent
          # Serial e2e_rest leg — no xdist fan-out; default 10g tmpfs wastes RAM
          # on ubuntu-latest. Cap is a RAM ceiling (tmpfs size=), not host-disk
          # headroom; ENOSPC on the runner is handled by _free-disk.
          PGDATA_TMPFS_SIZE: 2g
          # No host uvx in this job (no _setup-env); the dedicated Security
          # Audit check owns the uv-secure scan.
          RUN_ALL_SKIP_AUDIT: 1
      - name: Cleanup Docker services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true

  storyboard-conformance:
    # (#1858) Grades a MEASURED run of the real @adcp/sdk
    # storyboard runner as ordinary parametrized pytest tests
    # (tests/storyboard/), reusing the e2e_rest ledger/xfail/lock-test
    # discipline instead of a new comparator. The ledger
    # (tests/storyboard/known_failures.txt) IS seeded from a real in-network
    # run; its exact contents are pinned by EXPECTED_LEDGER in
    # tests/unit/test_storyboard_ledger_state.py — read the count there rather
    # than from a literal here, which has re-rotted on every re-seed. Still
    # NOT in the required-checks gate below (summary job's `needs`) — landing
    # report-only was deliberate so drift could be observed before making it
    # merge-blocking; flipping it in requires re-verifying the ledger against
    # a fresh in-network run first (branch-protection enforcement is a
    # separate, out-of-band GitHub settings change either way — matches
    # e2e_rest_known_failures.txt's own comment on this).
    name: Storyboard Conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Clean up lingering containers
        run: |
          docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The report generators below import `adcp` and `pyyaml`, and the bundle
      # action resolves the pin from that same installed SDK, so this job needs
      # the project venv. It did not before: it only ever drove docker compose.
      - uses: ./.github/actions/_setup-env
      # The pinned compliance/schema bundle is a GitHub release asset, not an npm
      # dependency, so it is fetched host-side into the bind-mounted tree that the
      # runner container sees at /app. npm deps are NOT installed here: the
      # `storyboard` tox env's commands_pre runs `npm ci` inside that container,
      # where the Node that executes the runner actually lives.
      #
      # Same action as the unit job, so both take the version from ONE source —
      # the installed SDK. This job hardcoded v3.1.1 while the unit job
      # regex-parsed it out of the prose of docs/adcp-spec-version.md; the two
      # could disagree with each other and both could disagree with the wheel.
      - id: bundle
        uses: ./.github/actions/_adcp-bundle
      # No host Postgres / host ports: run_all_tests.sh builds the pinned
      # creative agent, brings the stack up, waits for health, and executes tox
      # inside the compose network — the runner reaches the agent at proxy:8000
      # by service name, which is tests/storyboard's own default. (_setup-env IS
      # present above, but only so the report-publishing step below has a venv;
      # the conformance run itself uses none of it.)
      # Identical shape to the BDD In-Network job above; hand-rolling a compose
      # lifecycle here is what made this job fail on every earlier attempt.
      - name: Run storyboard conformance in-network
        run: ./run_all_tests.sh storyboard
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          # run_all_tests.sh builds the pinned creative agent host-side; prefer
          # the pin-keyed ghcr pull (~5m faster) over building from source.
          CREATIVE_AGENT_GHCR_IMAGE: ghcr.io/${{ github.repository }}/adcp-creative-agent
          # The dedicated Security Audit check owns the uv-secure scan, so it
          # is skipped here even though _setup-env now provides a host uv.
          RUN_ALL_SKIP_AUDIT: 1
      # Publish the machinery's OUTPUT, not a committed copy of it (#1858).
      # These three reports used to live in docs/test-obligations/; a committed
      # report obliges you to prove regeneration is byte-identical, and the
      # liveness input only exists on a host that has run the full BDD suite, so
      # that proof could never be given and the committed copies drifted twice.
      # Regenerating here means a reviewer reads the numbers from the run that
      # produced them.
      #
      # `--adcp` is passed EXPLICITLY: run_cli defaults it to ~/projects/adcp, a
      # personal clone that does not exist on a runner. The bundle below is the
      # sha256-verified release asset downloaded above.
      #
      # if: always() — a failing conformance run is exactly when the reports are
      # worth reading.
      - name: Publish storyboard reports to the job summary
        if: always()
        env:
          ADCP_BUNDLE: ${{ steps.bundle.outputs.bundle-dir }}
        run: |
          set -uo pipefail
          emit() {  # $1 = generator stem, $2 = human title
            printf '\n<details>\n<summary><b>%s</b></summary>\n\n' "$2" >> "$GITHUB_STEP_SUMMARY"
            if uv run python "scripts/audit/$1.py" --repo . --adcp "$ADCP_BUNDLE" --markdown \
                 >> "$GITHUB_STEP_SUMMARY" 2>/tmp/"$1".err; then
              :
            else
              {
                printf '\n> generator FAILED — stderr below\n\n```\n'
                tail -40 /tmp/"$1".err
                printf '\n```\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '\n</details>\n' >> "$GITHUB_STEP_SUMMARY"
          }
          emit storyboard_coverage_map "Storyboard coverage map"
          emit storyboard_roadmap      "Storyboard roadmap"
          emit storyboard_check_index  "Storyboard check index (one row per graded check)"
          # GitHub caps a job summary at 1 MiB and silently truncates past it.
          # The three total ~562 KB today; say so out loud if that changes.
          size=$(wc -c < "$GITHUB_STEP_SUMMARY")
          echo "job summary: ${size} bytes (GitHub cap: 1048576)"
          if [ "$size" -gt 1000000 ]; then
            echo "::warning::storyboard job summary is ${size} bytes, near GitHub's 1 MiB cap — it will truncate"
          fi
      - name: Cleanup Docker services
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v 2>/dev/null || true

  admin-ui-tests:
    name: Admin UI Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adcp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adcp_test
        options: >-
          --health-cmd "pg_isready -U adcp_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: ./.github/actions/_postgres
        with:
          database-url: ${{ env.DATABASE_URL }}
      # The Coverage gate combines unit + BDD only; add an artifact upload
      # before re-enabling coverage here, or the data is silently dropped.
      - uses: ./.github/actions/_pytest
        with:
          paths: tests/admin/
          extra_args: -m "not slow"

  bdd-tests-shard:
    name: BDD Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adcp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adcp_test
        options: >-
          --health-cmd "pg_isready -U adcp_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: ./.github/actions/_postgres
        with:
          database-url: ${{ env.DATABASE_URL }}
      - name: Resolve BDD shard paths
        id: bdd_shard
        run: |
          set -euo pipefail
          shard_list=$(mktemp)
          trap 'rm -f "$shard_list"' EXIT
          uv run python scripts/ci/shard_paths.py bdd ${{ matrix.shard }} > "$shard_list"
          mapfile -t TEST_FILES < "$shard_list"
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::shard_paths.py produced no files for bdd shard ${{ matrix.shard }}"
            exit 1
          fi
          joined="${TEST_FILES[*]}"
          echo "paths=${joined}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/_pytest
        env:
          # Separate data file per shard so artifacts cannot collide with unit's .coverage.
          COVERAGE_FILE: .coverage.bdd-${{ matrix.shard }}
        with:
          paths: ${{ steps.bdd_shard.outputs.paths }}
          coverage_xml: coverage-bdd-${{ matrix.shard }}.xml
          extra_args: -n auto --dist=load --timeout=60
      - name: Combine xdist coverage fragments
        run: |
          shopt -s nullglob
          fragments=(.coverage.bdd-${{ matrix.shard }}.*)
          if [ "${#fragments[@]}" -gt 0 ]; then
            uv run coverage combine --data-file=.coverage.bdd-${{ matrix.shard }} \
              .coverage.bdd-${{ matrix.shard }} "${fragments[@]}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bdd-shard-${{ matrix.shard }}-coverage
          path: |
            .coverage.bdd-${{ matrix.shard }}
            coverage-bdd-${{ matrix.shard }}.xml
          include-hidden-files: true
          if-no-files-found: error

  bdd-tests:
    name: BDD Tests
    runs-on: ubuntu-latest
    needs: [bdd-tests-shard]
    if: always()
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - name: Aggregate BDD shards
        run: |
          if [ "${{ needs.bdd-tests-shard.result }}" != "success" ]; then
            echo "One or more BDD shards failed."
            exit 1
          fi
          echo "BDD shards passed."

  migration-roundtrip:
    name: Migration Roundtrip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adcp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: adcp_test
        options: >-
          --health-cmd "pg_isready -U adcp_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: ./.github/actions/_postgres
        with:
          database-url: ${{ env.DATABASE_URL }}
          run-migrations: "false"
      - name: Migration roundtrip
        run: uv run python scripts/ci/migration_roundtrip.py

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, bdd-tests-shard]
    if: ${{ needs.unit-tests.result == 'success' && needs.bdd-tests-shard.result == 'success' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/_setup-env
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unit-coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bdd-shard-*-coverage
          merge-multiple: true
          path: bdd-coverage-shards
      - name: Coverage gate
        run: |
          set -euo pipefail
          expected_bdd_shards="$(uv run python -c "from scripts.ci.shard_split import SHARD_COUNTS; print(SHARD_COUNTS['bdd'])")"
          bdd_data_files=()
          for shard in $(seq 1 "${expected_bdd_shards}"); do
            found="$(find bdd-coverage-shards -name ".coverage.bdd-${shard}" -type f | head -1)"
            if [ -z "${found}" ]; then
              echo "::error::Missing BDD coverage artifact for shard ${shard} (.coverage.bdd-${shard})"
              exit 1
            fi
            bdd_data_files+=("${found}")
          done
          if [ "${#bdd_data_files[@]}" -ne "${expected_bdd_shards}" ]; then
            echo "::error::Expected ${expected_bdd_shards} BDD coverage files, found ${#bdd_data_files[@]}"
            exit 1
          fi
          if [ ! -f .coverage ]; then
            echo "Unit coverage data file missing."
            exit 1
          fi
          uv run coverage combine --data-file=.coverage.combined .coverage "${bdd_data_files[@]}"
          ./scripts/ci/coverage_report.sh --data-file .coverage.combined

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    timeout-minutes: 5
    needs:
      [
        quality-gate,
        type-check,
        schema-contract,
        security-audit,
        quickstart,
        smoke-tests,
        unit-tests,
        integration-tests,
        e2e-tests,
        admin-ui-tests,
        bdd-tests,
        bdd-in-network,
        migration-roundtrip,
        coverage,
      ]
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - name: Validate job results
        run: |
          if [ "${{ needs.quality-gate.result }}" != "success" ] || \
             [ "${{ needs.type-check.result }}" != "success" ] || \
             [ "${{ needs.schema-contract.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.quickstart.result }}" != "success" ] || \
             [ "${{ needs.smoke-tests.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.e2e-tests.result }}" != "success" ] || \
             [ "${{ needs.admin-ui-tests.result }}" != "success" ] || \
             [ "${{ needs.bdd-tests.result }}" != "success" ] || \
             [ "${{ needs.bdd-in-network.result }}" != "success" ] || \
             [ "${{ needs.migration-roundtrip.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required CI checks passed."
