name: Release Please

on:
  push:
    branches:
      - main
  # Sign an image that's already published, for a release whose sign-and-attest job failed (3.0.1:
  # its image_tags output was dropped). Only sign-and-attest runs, and only from main.
  workflow_dispatch:
    inputs:
      digest:
        description: Image digest to sign (sha256:...), as pushed to ghcr.io and Docker Hub
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Require CI green on release commit (D47 gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_SHA" ]] || { echo "ERROR: release-please.outputs.sha is empty (D47 gate broken)"; exit 1; }
          MAX_ATTEMPTS=45
          SLEEP_SEC=60
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA" \
              --jq '.workflow_runs[0].conclusion // "pending"')
            echo "Attempt $attempt/$MAX_ATTEMPTS: status=$STATUS"
            case "$STATUS" in
              success)
                echo "CI green on release commit"
                exit 0
                ;;
              failure|cancelled|timed_out)
                echo "CI ${STATUS} on release commit — refusing to publish broken image"
                exit 1
                ;;
              *)
                sleep "$SLEEP_SEC"
                ;;
            esac
          done
          echo "CI did not complete within $((MAX_ATTEMPTS * SLEEP_SEC))s (D47 gate timeout)"
          exit 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USER }}/salesagent
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
      - name: Compute SOURCE_DATE_EPOCH from git
        id: sde
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build amd64 image for pre-push Trivy gate
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: salesagent:release-gate-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.value }}
      - name: Trivy gate (pre-push OS/CVE scan, amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: salesagent:release-gate-amd64
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Build arm64 image for pre-push Trivy gate
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: salesagent:release-gate-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.value }}
      - name: Trivy gate (pre-push OS/CVE scan, arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: salesagent:release-gate-arm64
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1
          format: table
      - id: build
        name: Build and push multi-arch image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.value }}
          outputs: type=image,rewrite-timestamp=true

  sign-and-attest:
    needs: [release-please, build-and-push]
    # After a release's build, or on dispatch from main (when the other two jobs are skipped). A run
    # from another branch would sign with a refs/heads/<branch> identity that ADR-007's cosign verify
    # rejects.
    if: ${{ !cancelled() && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    env:
      IMAGE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.digest || needs.build-and-push.outputs.image_digest }}
      # The image names are written only here; signing, attestation and the scan all read them.
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USER }}/salesagent
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
      security-events: write
    steps:
      - uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      - name: Registry auth (daemon-free)
        env:
          GHCR_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DH_USER: ${{ secrets.DOCKERHUB_USER }}
          DH_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          cosign login ghcr.io -u "$GHCR_USER" -p "$GH_TOKEN"
          cosign login docker.io -u "$DH_USER" -p "$DH_PASS"
      - name: Sign image with cosign keyless
        env:
          DIGEST: ${{ env.IMAGE_DIGEST }}
          # The image names, not build-and-push's image_tags output: the tags include the Docker Hub
          # user, a secret, so GitHub drops that output between jobs ("Skip output 'image_tags' since
          # it may contain secret") and nothing was signed. A signature attaches to the digest, so
          # signing each image at the digest covers every tag.
          IMAGES: ${{ env.GHCR_IMAGE }} ${{ env.DOCKERHUB_IMAGE }}
          BUNDLE_DIR: /tmp/cosign-bundles-${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ -n "$DIGEST" ]] || { echo "ERROR: build-and-push image_digest is empty"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ERROR: not an image digest: $DIGEST"; exit 1; }
          read -ra images <<< "$IMAGES"
          # Signing nothing must fail, not pass silently as it did for 3.0.1.
          [[ "${#images[@]}" -gt 0 ]] || { echo "ERROR: no images to sign"; exit 1; }
          mkdir -p "$BUNDLE_DIR"
          count=0
          for image in "${images[@]}"; do
            signed=false
            safe_name="${image//\//-}"
            for attempt in 1 2 3; do
              bundle_path="${BUNDLE_DIR}/${safe_name}-${attempt}.json"
              if cosign sign --yes --bundle "$bundle_path" "${image}@${DIGEST}"; then
                signed=true
                break
              fi
              echo "cosign attempt $attempt failed for ${image} — retrying..."
              sleep 30
            done
            if [ "$signed" != true ]; then
              echo "ERROR: cosign sign failed for ${image} after 3 attempts"
              exit 1
            fi
            count=$((count + 1))
          done
          [[ "$count" -eq "${#images[@]}" ]] || { echo "ERROR: signed $count of ${#images[@]} images"; exit 1; }
      - name: Upload cosign bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cosign-bundles-${{ github.run_id }}
          path: /tmp/cosign-bundles-${{ github.run_id }}/*.json
          if-no-files-found: error
      # Build provenance comes only from the run that built the image. A dispatch run signs an image
      # it didn't build, so that release keeps only its original BuildKit provenance (ADR-007).
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        if: github.event_name == 'push'
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        if: github.event_name == 'push'
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - name: Scan image for OS-layer CVEs (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ env.IMAGE_DIGEST }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 0
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          sarif_file: trivy-results.sarif
          category: trivy-os-layer
