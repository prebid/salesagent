name: Release Please

on:
  push:
    branches:
      - main
  # Sign a published release whose sign-and-attest job failed (3.0.1: its image_tags output was
  # dropped). Only sign-and-attest runs, and only from main.
  workflow_dispatch:
    inputs:
      version:
        description: Release to sign (for example 3.0.1). Its v<version> release must exist, and <image>:<version> must name the same digest on ghcr.io and Docker Hub.
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

# The image names, written once: build-and-push pushes to them, sign-and-attest signs, attests and
# scans them.
env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USER }}/salesagent

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require CI green on release commit (D47 gate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$RELEASE_SHA" ]] || { echo "ERROR: release-please.outputs.sha is empty (D47 gate broken)"; exit 1; }
          MAX_ATTEMPTS=45
          SLEEP_SEC=60
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA" \
              --jq '.workflow_runs[0].conclusion // "pending"')
            echo "Attempt $attempt/$MAX_ATTEMPTS: status=$STATUS"
            case "$STATUS" in
              success)
                echo "CI green on release commit"
                exit 0
                ;;
              failure|cancelled|timed_out)
                echo "CI ${STATUS} on release commit — refusing to publish broken image"
                exit 1
                ;;
              *)
                sleep "$SLEEP_SEC"
                ;;
            esac
          done
          echo "CI did not complete within $((MAX_ATTEMPTS * SLEEP_SEC))s (D47 gate timeout)"
          exit 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.version }}
            type=raw,value=latest
      - name: Compute SOURCE_DATE_EPOCH from git
        id: sde
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Build amd64 image for pre-push Trivy gate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: salesagent:release-gate-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.value }}
      - name: Trivy gate (pre-push OS/CVE scan, amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: salesagent:release-gate-amd64
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1
          format: table
      - name: Build arm64 image for pre-push Trivy gate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: salesagent:release-gate-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.value }}
      - name: Trivy gate (pre-push OS/CVE scan, arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: salesagent:release-gate-arm64
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 1
          format: table
      - id: build
        name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.sde.outputs.value }}
          outputs: type=image,rewrite-timestamp=true

  sign-and-attest:
    needs: [release-please, build-and-push]
    # After a release's build, or on dispatch from main (when the other two jobs are skipped). A run
    # from another branch would sign with a refs/heads/<branch> identity that ADR-007's cosign verify
    # rejects.
    if: ${{ !cancelled() && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
      security-events: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
          disable-sudo-and-containers: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Registry auth (daemon-free)
        env:
          GHCR_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DH_USER: ${{ secrets.DOCKERHUB_USER }}
          DH_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          cosign login ghcr.io -u "$GHCR_USER" -p "$GH_TOKEN"
          cosign login docker.io -u "$DH_USER" -p "$DH_PASS"
      # After a release's build: the digest build-and-push pushed. On dispatch: the digest that a
      # published release's version tag names, which must be the same in both registries, so a
      # recovery run can only sign an image this workflow released.
      - name: Resolve the image digest
        id: digest
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DH_USER: ${{ secrets.DOCKERHUB_USER }}
          DH_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          set -euo pipefail
          # Prints the digest that <image>:<tag> names, from the registry's Docker-Content-Digest header.
          manifest_digest() {  # <image> <tag> <user> <password>
            local host="${1%%/*}" repo="${1#*/}" token_url api token
            case "$host" in
              ghcr.io) token_url="https://ghcr.io/token?scope=repository:${repo}:pull"; api="ghcr.io" ;;
              docker.io)
                token_url="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull"
                api="registry-1.docker.io" ;;
              *) echo "ERROR: unknown registry ${host}" >&2; return 1 ;;
            esac
            token=$(curl -fsS -u "$3:$4" "$token_url" | sed -n 's/.*"token": *"\([^"]*\)".*/\1/p')
            [[ -n "$token" ]] || { echo "ERROR: no pull token for $1" >&2; return 1; }
            curl -fsSI -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://${api}/v2/${repo}/manifests/$2" | tr -d '\r' | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: *//p'
          }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ERROR: not a release version: $VERSION"; exit 1; }
            gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null \
              || { echo "ERROR: no v${VERSION} release in ${GITHUB_REPOSITORY}"; exit 1; }
            ghcr=$(manifest_digest "$GHCR_IMAGE" "$VERSION" "$GHCR_USER" "$GH_TOKEN")
            dockerhub=$(manifest_digest "$DOCKERHUB_IMAGE" "$VERSION" "$DH_USER" "$DH_PASS")
            [[ -n "$ghcr" && "$ghcr" == "$dockerhub" ]] \
              || { echo "ERROR: ${VERSION} is '${ghcr}' on ghcr.io and '${dockerhub}' on Docker Hub"; exit 1; }
            digest=$ghcr
          else
            digest=$BUILD_DIGEST
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "ERROR: not an image digest: '${digest}'"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign image with cosign keyless
        id: sign
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          # The image names, not build-and-push's image_tags output: the tags include the Docker Hub
          # user, a secret, so GitHub drops that output between jobs ("Skip output 'image_tags' since
          # it may contain secret") and nothing was signed. A signature attaches to the digest, so
          # signing each image at the digest covers every tag.
          IMAGES: ${{ env.GHCR_IMAGE }} ${{ env.DOCKERHUB_IMAGE }}
          BUNDLE_DIR: /tmp/cosign-bundles-${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ -n "$DIGEST" ]] || { echo "ERROR: no image digest to sign"; exit 1; }
          read -ra image_list <<< "$IMAGES"
          # Signing nothing must fail, not pass silently as it did for 3.0.1.
          [[ "${#image_list[@]}" -gt 0 ]] || { echo "ERROR: no images to sign"; exit 1; }
          mkdir -p "$BUNDLE_DIR"
          for image in "${image_list[@]}"; do
            signed=false
            safe_name="${image//\//-}"
            for attempt in 1 2 3; do
              bundle_path="${BUNDLE_DIR}/${safe_name}-${attempt}.json"
              if cosign sign --yes --bundle "$bundle_path" "${image}@${DIGEST}"; then
                signed=true
                break
              fi
              echo "cosign attempt $attempt failed for ${image} — retrying..."
              sleep 30
            done
            if [ "$signed" != true ]; then
              echo "ERROR: cosign sign failed for ${image} after 3 attempts"
              exit 1
            fi
          done
      - name: Upload cosign bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosign-bundles-${{ github.run_id }}
          path: /tmp/cosign-bundles-${{ github.run_id }}/*.json
          if-no-files-found: error
      # A recovery run attests too, so `gh attestation verify` works for the release; its attestation
      # names the recovery run as the builder (ADR-007).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DOCKERHUB_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Scan image for OS-layer CVEs (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.digest.outputs.digest }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: 0
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-os-layer
