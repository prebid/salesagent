# Nginx config for multi-tenant production deployment (host-based routing)
# Used by run_all_services.py for Fly.io, Cloud Run, etc. when ADCP_MULTI_TENANT=true
# For single-tenant (path-based only), use nginx-single-tenant.conf
# For Docker Compose development, use nginx-development.conf
#
# TEMPLATE: This file uses ${SALES_AGENT_DOMAIN} which is substituted at runtime
# by run_all_services.py using envsubst. Set this environment variable before starting.
# Example: SALES_AGENT_DOMAIN=sales-agent.example.com

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Map the original client protocol to use as X-Forwarded-Proto
    # Fly.io sets both X-Forwarded-Proto and Fly-Forwarded-Proto with the original client protocol
    # We must use the incoming value, NOT $scheme (which is http since nginx sees internal traffic)
    # Priority: Fly-Forwarded-Proto > X-Forwarded-Proto > $scheme
    map $http_fly_forwarded_proto $fly_proto {
        default "";
        https   https;
        http    http;
    }
    map $http_x_forwarded_proto $incoming_proto {
        default $scheme;
        https   https;
        http    http;
    }
    # Use Fly-Forwarded-Proto if set, otherwise use X-Forwarded-Proto from upstream, otherwise $scheme
    map $fly_proto $forwarded_proto {
        default $incoming_proto;
        https   https;
        http    http;
    }

    # There is no $tenant here any more. This proxy used to parse the first label out
    # of $host and inject it as x-adcp-tenant — a THIRD way to name a tenant, agreeing
    # with the other two only when a tenant's id happened to equal its subdomain. The
    # app resolves a tenant from the Host it is given (Tenant.virtual_host) or from an
    # x-adcp-tenant the CLIENT sent, and from nothing else, so
    # this proxy's whole job is to pass $host through untouched.

    # Every location now sets one more proxy header than it used to (the strip below), and
    # the default 64-byte bucket no longer fits the set. Without this nginx warns and
    # ignores the bucket size on every start.
    proxy_headers_hash_bucket_size 128;

    # ONE host input reaches the app, and this is where that is made true.
    #
    # The Approximated proxy (optional, docs/deployment/multi-tenant.md § Step 4) serves a
    # publisher's own domain -- sales.publisher.com -- and forwards to
    # APPROXIMATED_BACKEND_URL. So the Host it sends names THIS BACKEND, identically for
    # every publisher, and the publisher's actual domain arrives in Apx-Incoming-Host.
    # That is the only reason the header exists: behind that proxy, Host cannot identify
    # anyone.
    #
    # Folding it back into Host here, and dropping the header on the way through, means the
    # app has exactly two ways to name a tenant -- Host -> tenants.virtual_host, and an
    # x-adcp-tenant the CLIENT sent -- with no third spelling of the first one. A second
    # spelling is not a redundancy: the two host ladders in the app disagreed about which
    # wins, so one request could resolve to two different tenants depending on which
    # resolver asked.
    #
    # Not a security control. A caller can set Apx-Incoming-Host on its OWN request, but
    # nobody can set a header on somebody else's, and what it buys is a tenant's public
    # landing page -- reachable by naming that tenant's real host anyway. A token is
    # verified inside the tenant it was issued for, so claiming a different host grants
    # nothing. This is about determinism, not defence.
    map $http_apx_incoming_host $tenant_host {
        ""      $host;
        default $http_apx_incoming_host;
    }

    # WebSocket connection upgrade: non-WS requests get "close"
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Upstream server (all services in single FastAPI process)
    upstream mcp_server {
        server localhost:8080;
    }

    # ─── Admin subdomain server ───────────────────────────────────────
    server {
        listen 0.0.0.0:8000;
        server_name admin.${SALES_AGENT_DOMAIN};

        # Health check — proxy to upstream so it reflects actual app readiness
        location /health {
            access_log off;
            proxy_pass http://mcp_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
        }

        # Root redirects to admin index
        location = / {
            proxy_pass http://mcp_server/;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /admin;
        }

        # All admin routes — X-Forwarded-Prefix tells CustomProxyFix this is /admin
        location / {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── Tenant-specific subdomain routing ────────────────────────────
    # Wildcard server_name so any host under this domain reaches the app; which tenant
    # it is, the app decides from the Host header.
    server {
        listen 0.0.0.0:8000;
        server_name *.${SALES_AGENT_DOMAIN};  # Wildcard + map replaces regex capture

        # Health check — proxy to upstream so it reflects actual app readiness
        location /health {
            access_log off;
            proxy_pass http://mcp_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
        }

        # Admin UI with X-Forwarded-Prefix (no tenant header — admin gets tenant from session)
        location /admin/ {
            proxy_pass http://mcp_server/admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_cache_bypass $http_upgrade;
        }

        location = /admin {
            return 301 $scheme://$host/admin/;
        }

        # Root serves tenant landing page
        location = / {
            proxy_pass http://mcp_server/;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        # Catch-all — the Host carries the tenant; the proxy adds nothing
        location / {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header x-adcp-auth $http_x_adcp_auth;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── Base domain server ───────────────────────────────────────────
    server {
        listen 0.0.0.0:8000;
        server_name ${SALES_AGENT_DOMAIN};

        # Health check — proxy to upstream so it reflects actual app readiness
        location /health {
            access_log off;
            proxy_pass http://mcp_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
        }

        # Root serves signup page
        location = / {
            proxy_pass http://mcp_server/signup;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Catch-all — proxies everything else to the single upstream
        location / {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header x-adcp-auth $http_x_adcp_auth;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── Default fallback server ──────────────────────────────────────
    server {
        listen 0.0.0.0:8000 default_server;
        server_name _;

        # Health check — proxy to upstream so it reflects actual app readiness
        location /health {
            access_log off;
            proxy_pass http://mcp_server/health;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
        }

        # Admin UI with X-Forwarded-Prefix
        location /admin/ {
            proxy_pass http://mcp_server/admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_cache_bypass $http_upgrade;
        }

        location = /admin {
            return 301 /admin/;
        }

        # Root serves the landing page. Which tenant it is for comes from $tenant_host,
        # like every other location here.
        location = / {
            proxy_pass http://mcp_server/;
            proxy_http_version 1.1;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Catch-all — proxies everything else to the single upstream
        location / {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $tenant_host;
            proxy_set_header Apx-Incoming-Host "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header x-adcp-auth $http_x_adcp_auth;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
