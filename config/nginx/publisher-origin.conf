# The e2e stack's test publishers (docker-compose.e2e.yml `publisher-origin`).
#
# Serves each publisher's /.well-known/adagents.json from the directory the BDD runner
# writes (tests/harness/publisher_authorization.py), keyed by the address of the server
# that dialed (X-Real-IP, set by tls-proxy) and the Host it asked for, port included:
#
#   <address>/                                  the runner of that server registered it
#   <address>/<host>/.well-known/adagents.json  the document, answered 200
#   <address>/<host>/unavailable                answer 503 instead
#   neither                                     404, which is how a missing file answers
#
# Each e2e worker's runner registers its own server's address, so a worker never reads a
# file another worker wrote. A request from an address no runner registered is refused
# with 421 and a body naming the address -- never another worker's document, never a
# default. Every request is logged with its Host, address and status: the record that the
# live server fetched the file itself.

log_format publisher '$time_iso8601 host=$http_host address=$http_x_real_ip "$request" $status';

server {
    listen 8080;
    access_log /dev/stdout publisher;
    root /srv/publishers/$http_x_real_ip/$http_host;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        if ($http_x_real_ip = "") {
            return 421 "publisher-origin: the request names no dialing address (X-Real-IP); it did not come through tls-proxy\n";
        }
        if (!-d /srv/publishers/$http_x_real_ip) {
            return 421 "publisher-origin: no BDD runner registered the dialing address $http_x_real_ip\n";
        }
        if (-f /srv/publishers/$http_x_real_ip/$http_host/unavailable) {
            return 503;
        }
        try_files $uri =404;
    }
}
