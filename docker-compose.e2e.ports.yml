# Host-port publishing overlay for docker-compose.e2e.yml.
#
# WHY THIS IS SEPARATE: the base docker-compose.e2e.yml publishes NO host ports
# so the in-network test runner (run_all_tests.sh) is immune to
# cross-stack host-port collisions — it reaches Postgres/the proxy by service
# name and many stacks can run concurrently.
#
# The HOST test paths, however, run pytest ON THE HOST and must reach the stack
# over localhost, so they DO need published ports. Those paths overlay this file:
#   - tests/e2e/conftest.py  (standalone branch: builds + ups its own stack; this
#                             is also the path GitHub CI uses for `pytest tests/e2e`)
#   - scripts/test-stack.sh  (host stack for run_all_tests.sh / make test-stack-up)
#
# Usage (host paths only):
#   docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.ports.yml up -d
#
# Compose merges these `ports` onto the base service definitions. Do NOT add this
# overlay to the in-network runner — that would reintroduce the collision surface.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"

  proxy:
    ports:
      - "127.0.0.1:${ADCP_SALES_PORT:-8092}:8000"

  # The TLS listener, published for the host paths. The port is a VARIABLE for
  # the same reason the two above are: several stacks run concurrently on one
  # box, and a hardcoded 8443 would reintroduce exactly the cross-stack
  # collision this overlay's header warns about. Callers allocate it
  # (scripts/test-stack.sh, tests/e2e/conftest.py) and export ADCP_TLS_PORT.
  tls-proxy:
    ports:
      - "127.0.0.1:${ADCP_TLS_PORT:-8443}:8443"

  # webhook-capture's READBACK control-plane (salesagent-amht.3) — plain HTTP,
  # published for the host paths only, same dynamic-allocation reasoning as
  # ADCP_TLS_PORT above: a fixed default would let two concurrent stacks
  # cross-wire onto the same host port, producing a confident false "the
  # server never delivered the webhook" (architect review). DELIVERY never
  # uses this port — it goes through tls-proxy above.
  webhook-capture:
    ports:
      - "127.0.0.1:${WEBHOOK_CAPTURE_PORT:-8090}:8080"
