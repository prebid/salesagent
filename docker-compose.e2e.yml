# Docker Compose for E2E tests
#
# Builds from source and exposes services via nginx proxy for production-like testing.
# Used by tests/e2e/conftest.py to run the full test suite.
#
# All services (MCP, A2A, Admin) run in a single FastAPI process behind nginx.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d
#
# Port configuration (via environment variables):
#   ADCP_SALES_PORT - Nginx proxy port (default: 8092, proxies to adcp-server:8080)
#   POSTGRES_PORT   - PostgreSQL port (default: 5435)

services:
  postgres:
    image: postgres:17-alpine
    # Throwaway test DB: ~79% of BDD wall time is CREATE DATABASE + DDL + writes
    # (per-test isolated DBs). Putting PGDATA on tmpfs (RAM) makes template
    # copies and DDL RAM-fast — this is the actual speed win, not durability
    # flags (on tmpfs, fsync/synchronous_commit are moot: there is no disk to
    # flush). Data is recreated every run and never persisted. max_connections
    # is raised for many parallel xdist workers. tmpfs size via PGDATA_TMPFS_SIZE.
    command:
      - postgres
      - -c
      - max_connections=300
    environment:
      POSTGRES_DB: adcp
      POSTGRES_USER: adcp_user
      POSTGRES_PASSWORD: secure_password_change_me
    tmpfs:
      - /var/lib/postgresql/data:size=${PGDATA_TMPFS_SIZE:-10g}
    # NO host port here — publishing lives in docker-compose.e2e.ports.yml, which
    # only the HOST paths overlay (conftest standalone branch, test-stack.sh). The
    # in-network runner uses this base file alone and reaches Postgres by service
    # name (postgres:5432), so it publishes ZERO host ports and many stacks can
    # run concurrently without a port collision.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcp_user -d adcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  adcp-server: &adcp-server
    build: .
    # NO `user:` directive, deliberately -- and this one is worth spelling out,
    # because it used to carry the OPPOSITE fix.
    #
    # The problem it was solving is real: adcp-server and `tests` bind-mount the
    # same /app, and whichever creates a path first owns it. The launcher created
    # logs/audit.log as its own uid; adcp-server (image uid 1001) then could not
    # open it; and because src/core/audit_logger.py:33 builds that FileHandler at
    # MODULE IMPORT time, the server died before serving one request, surfacing
    # as thousands of "Server not ready" errors instead of one permission error
    # (reproduced twice on this worktree).
    #
    # The fix attempted here was to pin BOTH services to the same
    # "${TEST_UID:-0}:${TEST_GID:-0}". That works on a ROOTFUL daemon, which is
    # what its reasoning assumed ("no userns-remap on these hosts, so container
    # root IS host root"). The run boxes are ROOTLESS, where it is wrong in both
    # directions: with TEST_UID exported the container runs as that uid INSIDE
    # the container and rootless maps it to a host SUBUID (~100000+uid), so /app
    # collects files the run cannot write; without it -- a bare `docker compose
    # up`, or cassini's supervisor invoking the stack -- the `:-0` default hits.
    #
    # Under rootless, container root ALREADY maps to the invoking user. Both
    # services unset therefore land on ONE identity, which is what "make both
    # sides one uid" was reaching for, without any uid plumbing to get wrong.
    # cassini deleted the identical workaround on its own side for the same
    # reason (cassini/identity.py: "a workaround for a root daemon, and there is
    # no longer a root daemon").
    #
    # HOME: /tmp below is kept: harmless once the baked uid 1001 (which does have
    # a passwd entry) is back, and removing it is a separate change.
    environment: &adcp-server-env
      # A raw numeric uid has no /etc/passwd entry, so HOME would default to "/"
      # (unwritable). Same reason the `tests` service sets this.
      HOME: /tmp
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      # Pin strict schema validation (extra="forbid") for the e2e_rest boundary so
      # the live server rejects spec-invalid input the same way the dev/test
      # transports do. is_production() defaults to "development" already, but make
      # it explicit so a future Dockerfile/env change can't silently flip the
      # boundary to production's lenient extra="ignore".
      ENVIRONMENT: development
      SKIP_NGINX: "true"
      SKIP_CRON: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      ADCP_TESTING: ${ADCP_TESTING:-true}
      ADCP_AUTH_TEST_MODE: ${ADCP_AUTH_TEST_MODE:-true}
      # ─── Outbound egress escape hatch — TEST STACK ONLY ─────────────────────
      # The seam (src/core/security/outbound_http.py) refuses non-https schemes
      # (unconditionally, no hatch — GH #1757) and reserved/private
      # addresses (ADCP_OUTBOUND_ALLOW_PRIVATE, which stays open: every origin
      # on a compose network resolves to a private bridge address). What used
      # to also live here, ADCP_OUTBOUND_ALLOW_INSECURE, is DELETED — every
      # outbound origin this server dials is TLS-fronted now: the webhook
      # capture (webhook-capture, https via the shared tls-proxy front below
      # at webhooks.adcp.test, GH #1299) and creative-agent (https via
      # the shared tls-proxy front below), and the LocalOrigin-backed
      # integration suites migrated to the https local_origin_tls fixture
      # (GH #1757). Nothing in this stack needs plaintext http anymore.
      #
      # Deliberately NOT set in docker-compose.yml: that is the developer stack
      # (CLAUDE.md: `docker compose up -d` -> localhost:8000) and is what gets
      # copied into deployment templates. Opening it there would disable egress
      # policy for every developer and leak it into production configs.
      #
      # CONSTRAINT this places on refusal testing: with the hatch open, NO e2e
      # or bdd_e2e scenario running in this stack can grade a PRIVATE-RANGE
      # refusal — the seam will accept exactly the addresses it is supposed to
      # reject. That grading stays in-process (integration + BDD), where
      # set_flags() in tests/integration/test_outbound_http.py monkeypatches the
      # variable to the literal "false" per case and is therefore immune to
      # this ambient env. SCHEME refusal, by contrast, is now gradeable in THIS
      # stack too (there is no hatch left to disarm it), and as of
      # GH #1802 it IS graded here: local-egress-ssrf-refusal.
      # feature's plaintext-http scenario now runs live under this stack's own
      # open posture instead of being held to private=False and declared
      # unrealizable. It can be, because the scheme is checked before
      # allow_private is read at all (src/core/security/egress/policy.py:322,
      # ahead of :331/:333), so this ambient env cannot change that scenario's
      # outcome. The private-range gate remains a separate, still
      # untestable-in-network claim.
      #
      # CLOUD METADATA is refused UNCONDITIONALLY regardless of any hatch — the
      # SDK's metadata check runs before the allow_private gate, so
      # 169.254.169.254 is rejected even with ADCP_OUTBOUND_ALLOW_PRIVATE=true.
      # The six #974 SUPPLEMENT RANGES (CGNAT 100.64/10 and friends) are the
      # second such immunity, and this repo owns it rather than inheriting it:
      # adcp.signing does not classify those ranges at all, so the seam's own
      # predicate is the only thing that refuses them and it sits OUTSIDE the
      # hatch (GH #1802). They are therefore gradeable in this stack
      # too, and local-egress-ssrf-refusal.feature grades one (100.64.0.1) in
      # both hatch-open outlines. Note what a regression looks like here: with
      # the check back behind the hatch the address is accepted and dialled for
      # real, so the row fails as a delivery failure after connect timeouts
      # rather than as an instant refusal.
      # What can NEVER be graded in-network is the general private-range
      # refusal — the classes the SDK's own flags decide (RFC 1918, loopback,
      # link-local, multicast, reserved, unspecified): every origin on a compose
      # network resolves to a bridge address, so ALLOW_PRIVATE has to stay open
      # regardless, and opening it relaxes exactly those flags.
      ADCP_OUTBOUND_ALLOW_PRIVATE: "true"
      # (SSL_CERT_FILE for this service is set ONCE, below, next to the signing
      # KEK — see that block. Both branches added the key here independently and
      # a second copy would be a duplicate mapping key.)
      # Keep this server's log files OFF the bind mount it shares with `tests`.
      # The image bakes USER app (uid 1001) while `tests` runs as the image
      # default (root; the `user:` pin is gone -- see that service below), so
      # with the default CWD-relative path both create
      # /app/logs/*.log on the same mounted tree. Whoever got there first owned
      # the files at umask-derived mode 644 and the other uid could no longer
      # open them for append — surfacing as `PermissionError: [Errno 13]
      # Permission denied: '/app/logs/audit.log'` and killing entire suites at
      # pytest COLLECTION, apparently at random because it depended purely on
      # which container won the race.
      #
      # A container-local path (not a volume at /app/logs — Docker would create
      # THAT mount point on the host as root:755 and lock `tests` out of its own
      # log directory instead; measured) means the two never share a path at
      # all. /tmp is writable by any uid, so this holds however the image's user
      # is configured. The database remains the audit authority; these files are
      # a backup.
      ADCP_LOG_DIR: /tmp/adcp-logs
      # The SERVER must know about the pinned in-network creative agent: sync/
      # create flows resolve format specs server-side, and references carry the
      # PUBLIC canonical agent_url — without this, the registry's connection
      # alias has nothing to route to and the server calls the LIVE public host,
      # which rate-limits under CI load. The runner service
      # already sets the same value for the direct integration tests.
      # https, via the shared tls-proxy front below.
      CREATIVE_AGENT_URL: https://creative-agent.adcp.test:8443/api/creative-agent
      CREATE_DEMO_TENANT: "true"
      # The LIVE server needs the same signing KEK the dev stack has (#1291 D1).
      # A scenario's Given mints a tenant signing key through production, which
      # stores the private PEM encrypted under this KEK; the server then has to
      # DECRYPT it to derive webhook_signing.supported. Without these two lines the
      # server cannot open a key the runner just minted, derives supported=false,
      # and the e2e_rest leg of every key-dependent capability row fails against a
      # key that genuinely exists — a failure that no in-process run can reproduce,
      # because only e2e_rest crosses into this container.
      # Same worthless value as docker-compose.yml, and for the same reason.
      # The trust store for EVERY outbound TLS call this server makes: the
      # counterparty walk (salesagent-mp53.8) and, since GH #1757/#1291, the
      # https origins behind the shared tls-proxy front — CREATIVE_AGENT_URL
      # above and the webhook receiver. The seam's TLS client (adcp.signing's
      # ip_pinned_transport) builds a bare ssl.create_default_context() too, so
      # this one variable is what makes *.adcp.test / *.adcp-e2e.dev verify at
      # all. The inbound verifier resolves an unknown signer by
      # fetching capabilities -> brand.json -> JWKS from the counterparty over
      # the stack's own TLS front, and the SDK builds that client with a bare
      # ssl.create_default_context() per hop — trust_env=False on its httpx
      # clients is an httpx-level flag and provably cannot reach it, so only the
      # OpenSSL env vars do. Without this the walk dies at certificate
      # verification and surfaces as capabilities_unreachable, i.e. a SILENT
      # request_signature_key_unknown.
      #
      # The file is the CONCATENATED bundle (public roots + our test CA), emitted
      # by gen_test_tls.py so it stays in step with the CA it trusts, and already
      # visible in here through the .:/app mount below. CONCATENATED, never
      # ca.pem alone: SSL_CERT_FILE REPLACES the process's entire default cafile,
      # and a CA-only file leaves the container trusting nothing else — confirmed
      # the hard way on the runner side by a full suite run failing `uv sync`
      # against pypi.org with UnknownIssuer. Verification stays fully ON against
      # a real CA — this is the receiver-side twin of the runner's E2E_CA_BUNDLE,
      # not a hatch, and it is NOT the private-destination pin (that one has no
      # env reader by design — see
      # tests/unit/test_architecture_no_private_destinations.py).
      #
      # ca-bundle.pem, not combined-ca.pem: both names are the SAME concatenation
      # and gen_test_tls.py emits both, but this path is what
      # tests/unit/test_architecture_e2e_counterparty_origin_wiring.py pins for
      # THIS service. The runner below, and run_all_tests_host.sh on the host,
      # name combined-ca.pem. Collapsing the two into one filename is a
      # follow-up for the generator, not for this file.
      SSL_CERT_FILE: /app/.test-tls/ca-bundle.pem
      ADCP_SIGNING_KEY_PASSPHRASE_ENV: "ADCP_SIGNING_DEV_KEK"
      ADCP_SIGNING_DEV_KEK: "dev-only-signing-kek-not-a-secret"
      DELIVERY_WEBHOOK_INTERVAL: ${DELIVERY_WEBHOOK_INTERVAL:-}
      # GH #1802: the breaker's RECOVERY timeout only. Reaching
      # HALF_OPEN honestly means waiting this out inside the server, and 60s per
      # scenario is wall clock the suite should not spend. This is a VALUE, not a
      # branch — the server runs the same line of code here and in production,
      # which is the whole distinction (prebid/salesagent#2094).
      #
      # The failure and success THRESHOLDS are deliberately left at their
      # production defaults (5 and 2): the scenarios assert on those numbers
      # ("exactly 5 delivery attempts"), so shortening them here would make the
      # test agree with a policy production does not run.
      ADCP_WEBHOOK_BREAKER_TIMEOUT_SECONDS: ${ADCP_WEBHOOK_BREAKER_TIMEOUT_SECONDS:-5}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-PEg0SNGQyvzi4Nft-ForSzK8AGXyhRtql1MgoUsfUHk=}  # TEST ONLY — never use in production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SALES_AGENT_DOMAIN: "sales-agent.example.com"
      ADCP_MULTI_TENANT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # BLACKHOLE the live public creative agent: tests must NEVER depend on it
      # (its catalog drifts and it rate-limits under CI load,
      #). The registry aliases this host to the pinned in-network
      # agent; if any code path regresses and connects to it verbatim, this makes
      # it fail INSTANTLY (connection refused) instead of flaking on a 429.
      - "creative.adcontextprotocol.org:127.0.0.1"
    # Same Docker embedded-DNS concurrent-lookup race fix as the runner — the
    # server resolves postgres/creative-agent and the webhook callback host.
    dns_opt:
      - single-request-reopen
    volumes:
      - .:/app
    # adcp-server's own process identity is baked into the Dockerfile (uid
    # 1001, gid "app") — independent of whoever invokes run_all_tests.sh.
    # Its mitigation for the bind-mounted logs/ tree (mkdir+chmod 2775
    # setgid, rm+recreate each file at 664) only grants write access to a
    # file's OWNER and GROUP; without this, uid 1001 is never a member of
    # the invoker's group and falls into 664's read-only "other" bucket --
    # PermissionError: '/app/logs/audit.log' at import time, the container
    # crashes and never restarts (salesagent-dhhlg). ADCP_LOG_DIR above
    # already redirects the app's OWN logging off this bind mount entirely
    # (a separate, independent fix); this is defense-in-depth for whatever
    # else on this mount adcp-server's own uid might still need to touch.
    group_add:
      - "${TEST_GID:-0}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 60s, not creative-agent's 30s (below) -- adcp-server does more work
      # at startup (DB migrations, etc.) and is the service that actually
      # showed this bug live: marked genuinely UNHEALTHY (not just
      # `starting`) under heavy concurrent test-suite load, because there
      # was no grace period for Docker to report `starting` during
      start_period: 60s

  # ─── The agent the STORYBOARD grades, and only the storyboard ───────────────
  #
  # A conformance storyboard grades a DEPLOYED seller, and a deployed seller runs the
  # production boundary: `extra="ignore"`, so a property this seller's schemas do not
  # declare is DROPPED rather than refused. AdCP 3.1 extends the `idempotency_key`
  # request envelope to every task request including read-only tools
  # (compliance/universal/read-tool-idempotency.yaml, titled "TOLERANCE": "Sellers MUST
  # tolerate the field on reads in 3.1"), while the pinned per-tool read schemas still do
  # not declare it. Under development strictness the five read tools therefore REFUSED a
  # field the spec says to tolerate, and answered INVALID_REQUEST to a conformant buyer.
  #
  # A SECOND server rather than flipping `adcp-server` above, because that setting is
  # deliberate and carries its own comment: bdd_e2e/e2e/admin want the live server to
  # reject spec-invalid input exactly as the in-process transports do, and that grading
  # must not be softened to make a different suite pass. Two servers, one database, each
  # graded under the posture its own suite is about.
  #
  # Merged from the anchors above, so there is ONE owner of this service's shape and this
  # block states only the difference. Everything else -- image, volumes, extra_hosts, the
  # egress posture, the TLS trust store -- is inherited and cannot drift.
  #
  # No proxy in front of it: config/nginx/nginx-development.conf is a pass-through
  # (`proxy_pass http://$adcp_server$request_uri`, no rewriting) that forwards `Host`
  # unchanged, so for the storyboard's paths the hop changes nothing it grades. The
  # runner reaches this service directly on 8080, which is where the FastAPI process
  # serves /mcp/ and /a2a (SKIP_NGINX is true; the healthcheck already probes :8080).
  adcp-server-storyboard:
    <<: *adcp-server
    # Waits for adcp-server to be HEALTHY, not merely started, and that is about MIGRATIONS.
    # The entrypoint runs `alembic upgrade` on boot; two servers booting together against one
    # database run it twice concurrently, and the loser dies on the half-applied step:
    #
    #   Running upgrade 7a8c3e1170a5 -> a164b85bab9e
    #   column "payload_hash" of relation "media_buys" already exists
    #
    # Sequencing on health is what makes the second run a no-op: by then the first has
    # finished and alembic finds nothing left to apply. The inherited depends_on (postgres
    # only) is REPLACED rather than extended -- a `<<:` merge overwrites the key, so postgres
    # is restated here; dropping it would let this service start before the database.
    depends_on:
      postgres:
        condition: service_healthy
      adcp-server:
        condition: service_healthy
    environment:
      <<: *adcp-server-env
      # A GRADING deployment, which is NOT the same thing as a production one — and the two
      # used to be spelled with the same variable.
      #
      # What this service needs from "production" is exactly one behaviour: the
      # forward-compatible request boundary (`extra="ignore"`), because a conformance
      # storyboard grades a DEPLOYED seller and AdCP 3.1 puts `idempotency_key` on every task
      # request while compliance/universal/read-tool-idempotency.yaml requires sellers to
      # TOLERATE fields they do not declare. Under development strictness the five read tools
      # answered INVALID_REQUEST to it. That need is now stated outright.
      #
      # What it must NOT claim is production, because `SigningSettings` refuses a
      # `counterparty_registry` and both override maps under any production signal — and it
      # is right to. The conformance corpus PUBLISHES the private keys of the keyids
      # registered below (`_private_d_for_test_only` in keys.json), so a production
      # deployment trusting them would let anyone at all sign as a registered counterparty.
      # Claiming production here would mean either losing the relaxations (and with them
      # every stateful vector) or weakening that refusal for every real deployment.
      ENVIRONMENT: conformance
      ADCP_PYDANTIC_EXTRA_MODE: ignore
      # The signed-requests test-kit contract
      # (dist/compliance/3.1.1/test-kits/signed-requests-runner.yaml), DERIVED by
      # scripts/setup/storyboard_signing.py from the vendored keys.json and the kit's own
      # numbers, and exported by scripts/test-stack.sh before `compose up`. Never literals
      # here: three of the four carry key material or a graded threshold, and a copy in YAML
      # is a 401 on every positive vector the day the corpus is re-vendored.
      #
      # Empty when the stack is brought up some other way, which `env_ignore_empty` on
      # SigningSettings reads as unset — that agent simply grades nothing signed rather than
      # failing to boot.
      ADCP_SIGNING_COUNTERPARTY_REGISTRY: ${ADCP_SIGNING_COUNTERPARTY_REGISTRY:-}
      ADCP_SIGNING_REVOKED_KEYIDS: ${ADCP_SIGNING_REVOKED_KEYIDS:-}
      ADCP_SIGNING_PER_KEYID_CAP_OVERRIDES: ${ADCP_SIGNING_PER_KEYID_CAP_OVERRIDES:-}
      ADCP_SIGNING_REPLAY_TTL_OVERRIDES: ${ADCP_SIGNING_REPLAY_TTL_OVERRIDES:-}

  proxy:
    image: nginx:stable
    volumes:
      - ./config/nginx/nginx-development.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - adcp-server
    # NO host port here either — see the postgres note above. Publishing for the
    # host paths is in docker-compose.e2e.ports.yml; the in-network runner reaches
    # the proxy by service name (proxy:8000).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── TLS listener (GH #1291 / salesagent-tgzb, collapsed onto one front —
  # amht.2 + mp53.8/.9) ──────────────────────────────────────────────────────
  # ADDITIVE, never a migration: `proxy` above keeps its plaintext :8000 exactly
  # as it is, and E2E_BASE_URL still points there. This is a SECOND listener, on
  # a SECOND port, at DOTTED names — the one thing the plaintext stack cannot
  # provide. `_get_protocol_for_domain` answers https for `proxy.adcp.test:8443`
  # because the name has a dot and is not loopback; this service is what makes
  # that answer true rather than merely asserted.
  #
  # ONE service fronts every origin the shared stack dials outbound — a dotted
  # alias per origin, chosen by the nginx `map $ssl_server_name` in the shared
  # template — across BOTH namespaces the generated leaf covers:
  #   *.adcp.test     proxy, creative-agent, webhooks (the seller-side fronts)
  #   *.adcp-e2e.dev  webhooks, counterparty (origins the SERVER dials outbound,
  #                   where a REGISTRABLE domain is required: the outbound
  #                   webhook path's reserved-TLD gate refuses .test, and the
  #                   counterparty walk's eTLD+1 match needs a real one).
  # Adding an origin is one alias here plus one map line there — NOT a new
  # service: a compose service's `aliases` list can carry any number of names,
  # so fronting a second upstream never required a second container. Exactly one
  # terminator is a structural guard
  # (tests/unit/test_architecture_e2e_compose_tls_origins.py).
  #
  # Stock nginx:stable — the entrypoint renders /etc/nginx/templates/*.template
  # into conf.d with envsubst, so ${TLS_UPSTREAM} is per-instance and no custom
  # image is needed. Per-worker bdd_e2e sidecars run this same service+template
  # with their own single upstream (see run_all_tests.sh) — the SNI map falls
  # back to ${TLS_UPSTREAM} for any name it doesn't recognize, which is exactly
  # every per-worker sidecar's dotted container name.
  #
  # The certificate must exist BEFORE `up`: every entry point calls
  # scripts/dev/ensure-test-tls.sh first (test-stack.sh, run_all_tests.sh,
  # tests/e2e/conftest.py). Without it the bind mount below would materialise an
  # empty directory and nginx would fail to start.
  tls-proxy:
    image: nginx:stable
    environment:
      TLS_UPSTREAM: ${TLS_UPSTREAM:-adcp-server:8080}
    volumes:
      - ./config/nginx/nginx-tls-test.conf.template:/etc/nginx/templates/tls-test.conf.template:ro
      - ./.test-tls:/app/.test-tls:ro
    depends_on:
      # One entry per fronted upstream, so the terminator never comes up ahead
      # of something it routes to.
      - adcp-server
      - adcp-server-storyboard
      - creative-agent
      - webhook-capture
      - counterparty-origin
    networks:
      default:
        # Dotted aliases are the whole mechanism for the SHARED stack — one per
        # fronted origin, all on this one service. (The per-worker sidecars
        # cannot use aliases at all — `docker compose run` has no
        # --network-alias — so they carry a dotted CONTAINER NAME instead.)
        aliases:
          - proxy.adcp.test
          - creative-agent.adcp.test
          # The e2e webhook-capture origin, under BOTH namespaces
          # (salesagent-amht.3 named it .adcp.test; salesagent-mp53.9 moved the
          # name the SERVER actually dials to .adcp-e2e.dev, because the
          # outbound webhook path's reserved-TLD gate in
          # notification_proof_service refuses .test). Either way it is an ALIAS
          # on the existing front, never a second `listen ... ssl` service: one
          # terminator, one certificate, one place to keep in step. SNI decides
          # which upstream a connection reaches — see the $ssl_server_name map in
          # config/nginx/nginx-tls-test.conf.template, which must carry a row for
          # BOTH names or the unmapped one silently falls back to ${TLS_UPSTREAM}
          # (adcp-server) and delivery lands on the wrong service.
          - webhooks.adcp.test
          - webhooks.adcp-e2e.dev
          # The counterparty identity origin (salesagent-mp53.8). Another SNI
          # alias on the SAME front — see the $ssl_server_name map. It sits under
          # .adcp-e2e.dev because the inbound walk matches the signer's eTLD+1,
          # which needs a registrable domain; the generated leaf carries
          # *.adcp-e2e.dev as a SAN for exactly this.
          - counterparty.adcp-e2e.dev
          # The storyboard agent, fronted here for A2A's sake. A2A is card-first:
          # the runner reads the RPC endpoint off /.well-known/agent-card.json, and
          # the card renders https for any non-loopback host (src/app.py
          # get_protocol). Dialed plaintext on :8080 it therefore published
          # `https://adcp-server-storyboard:8080/a2a` — TLS against a plaintext port
          # — and every card-derived call failed with `fetch failed`, taking 25
          # checks and, with them, the capability probe that SELECTS storyboards: the
          # A2A axis graded 25 storyboards where MCP graded 44. Behind this front the
          # scheme the card publishes is the scheme the origin speaks.
          #
          # It is in the healthcheck below, like the other three. It was the one alias
          # this service owns that the healthcheck did not probe, so the front could be
          # broken while the service reported healthy -- and the storyboard job then ran
          # to completion with 30 checks reporting `<!doctype html>` from the MCP
          # endpoint, which is what nginx serves when it cannot reach the upstream. A
          # front that is not probed is a front whose failure arrives as someone else's
          # mystery.
          - storyboard.adcp.test
    # One curl per alias the front carries: each proves the handshake succeeds
    # for that NAME (i.e. the leaf's SANs really cover it, the failure mode a
    # single-name check misses), and the creative-agent row additionally proves
    # SNI routing, since its path 404s on the ${TLS_UPSTREAM} fallback.
    #
    # storyboard.adcp.test IS PROBED. This file used to argue the opposite -- that its
    # SAN coverage was already proven by the wildcard rows above, and that curling it
    # would hold tls-proxy `starting` through adcp-server-storyboard's second boot. The
    # first half was true and irrelevant: the risk is not SAN coverage, it is the
    # UPSTREAM being unreachable behind a front that reports healthy anyway. #1721
    # measured what that costs -- the storyboard job ran to completion with 30 checks
    # reading `<!doctype html>` off the MCP endpoint, which is what nginx serves when it
    # cannot reach the upstream. A front that is not probed is a front whose failure
    # arrives as someone else's mystery. The boot-delay cost is real and is the price.

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --cacert /app/.test-tls/ca.pem https://proxy.adcp.test:8443/health && curl -fsS --cacert /app/.test-tls/ca.pem https://creative-agent.adcp.test:8443/api/creative-agent/health && curl -fsS --cacert /app/.test-tls/ca.pem https://webhooks.adcp.test:8443/health && curl -fsS --cacert /app/.test-tls/ca.pem https://webhooks.adcp-e2e.dev:8443/health && curl -fsS --cacert /app/.test-tls/ca.pem https://counterparty.adcp-e2e.dev:8443/health && curl -fsS --cacert /app/.test-tls/ca.pem https://storyboard.adcp.test:8443/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: the long-lived `webhook-capture` receiver that GH #1299 introduced
  # here is declared ONCE, further down beside `counterparty-origin`, its
  # sibling bare-python origin. Same service, same image, same module — only
  # the position in the file differs, and two declarations would be a duplicate
  # mapping key that `docker compose` rejects outright.

  # In-network test runner (Option 1). Reaches Postgres/the server by SERVICE
  # NAME on the compose network — postgres:5432, proxy:8000 — so it needs NO
  # published host ports. Each `docker compose -p <project>` gets its own
  # isolated network, so `postgres` here can never collide with another stack's
  # `postgres`. This removes the host-port TOCTOU race that scripts/test-stack.sh
  # hits when guessing free ports in 50000-60000 under a crowded Docker host.
  #
  # Gated behind a profile so a normal `up` does not start it; the runner is
  # launched explicitly via `docker compose run --rm tests ...`
  # (see run_all_tests.sh).
  tests:
    profiles: ["runner"]
    # NO `user:` directive, deliberately -- back to main's shape (Aug 2026).
    # Both branches removed the pin independently; this records both arguments,
    # because they are different and each still holds.
    #
    # It used to pin user: "${TEST_UID:-0}:${TEST_GID:-0}", derived from
    # `id -u`/`id -g` by run_all_tests.sh, to stop the container writing
    # test-results/.tox/schemas/logs into the bind-mounted /app as literal root.
    # That rested on "no userns-remap on these hosts, so container root IS host
    # root" -- false on the ROOTLESS daemon the run boxes use, and wrong in BOTH
    # directions there:
    #   - with TEST_UID exported, the container runs as that uid INSIDE the
    #     container, which rootless maps to a host SUBUID (~100000+uid), so the
    #     bind-mounted /app collects files the run itself cannot write;
    #   - without it -- any path that does not source run_all_tests.sh, e.g.
    #     cassini's supervisor calling `docker compose run tests`, or a plain
    #     `docker compose up` for adcp-server -- the `:-0` default applies, i.e.
    #     exactly the image default the pin was written to override.
    # Under rootless, container root ALREADY maps to the invoking user, which is
    # exactly the outcome the pin was hand-building. Unset gets it for free.
    # cassini removed the identical workaround on its own side for the same
    # reason (cassini/identity.py: "a workaround for a root daemon, and there is
    # no longer a root daemon").
    # Symptom this caused live: /app/logs/* created root-owned, adcp-server
    # (uid 1001) dying at import on a module-level FileHandler, cascading into
    # ~2100 test failures. (ADCP_LOG_DIR on adcp-server above closes the log-file
    # half of that independently, whatever uid either container runs as.)
    #
    # What the pin cost was real, and is why several things below revert with it.
    # Being non-root forced three workarounds for image paths owned by root
    # (HOME/UV_CACHE_DIR, PLAYWRIGHT_BROWSERS_PATH -- the last re-downloading
    # 113 MiB of chromium every run because the baked copy was unreachable), and
    # it is why the tox_data volume had to be dropped: a fresh named volume's
    # mountpoint is created root:root by the daemon before the container starts,
    # which EACCES-blocks a non-root user from `mkdir .tox/<env>`. As the image
    # default that mountpoint is writable again, so the volume comes back below
    # and .tox leaves the bind mount -- which was the pin's own stated reason for
    # existing.
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      # Unbuffered stdout/stderr for the tox process that actually runs the
      # suite. cassini sets PYTHONUNBUFFERED on its supervisor's own subprocess
      # env, but the work runs HERE -- a separate container started by
      # `docker compose run tests` -- and this environment: block is a curated
      # allowlist with no host passthrough, so it never arrived. Verified live
      # by `docker exec ... env | grep PYTHONUNBUFFERED` returning nothing.
      # Consequence: output sat in the buffer, so cassini's RunState.quiet_for
      # climbed monotonically (0m34s -> 12m+) on a genuinely busy run at 1082%
      # CPU that finished exit=0, crossing the 5-minute false-red threshold
      # (reproduced end-to-end on a full in-network run). Same reason a detached
      # run's supervisor log is its only live view: buffered, a working run
      # looks wedged and a wedged one looks busy. Parameterised rather than a
      # literal "1" so a host can still turn it off for a one-off run; the
      # default is what matters and it is on.
      PYTHONUNBUFFERED: "${PYTHONUNBUFFERED:-1}"
      # HOME, UV_CACHE_DIR and PLAYWRIGHT_BROWSERS_PATH overrides removed with
      # the `user:` pin above (Aug 2026). All three existed solely to route
      # around image paths owned by root (/cache/uv, /ms-playwright) that a raw
      # numeric non-root UID could not write: such a UID has no /etc/passwd
      # entry, so HOME defaulted to "/" and uv failed to even create its cache
      # dir, surfacing as a confusing "could not find python interpreter" from
      # tox. As the image default (root) those paths are writable again, so the
      # overrides buy nothing and cost the warm caches baked at build time --
      # dropping PLAYWRIGHT_BROWSERS_PATH in particular restores the pre-
      # installed chromium instead of re-downloading it into /tmp every run.
      # Recorded, not deleted, because the reasoning returns verbatim the day a
      # `user:` pin does; do not re-add one without re-adding these three.
      #
      # #1941 and #1858 both reworded this same block to say HOME/UV_CACHE_DIR
      # are "RETAINED", and that wording is NOT carried over -- deliberately,
      # and it is not a decision reversed here. Neither PR ADDED those two keys;
      # they predate both, and all either changed was the prose above them,
      # explaining why it left them alone while removing the `user:` pin.
      # Nothing in either reads the variables (checked: the only other
      # UV_CACHE_DIR in the repo is the baked Dockerfile.test/Dockerfile
      # default, and no script reads HOME=/tmp). With the pin gone, /cache/uv is
      # writable by the image default, so the redirect cannot fix anything and
      # only throws away the cache warmed at build time -- so the removal stands
      # and this note records the divergence.
      #
      # #1858 also moved PYTHONUNBUFFERED to sit BELOW those two keys and
      # rewrote its comment in supervisor-generic terms. The key is unchanged in
      # value and the mapping is unordered, so only the prose differed; the
      # fuller cassini-specific account above is kept because it names the
      # reproduction. #1858's one added observation -- that the
      # ${VAR:-default} form matches BDD_E2E_ENABLED below -- is why the
      # parameterised form is retained rather than a literal "1".
      # Fixed in-network DB address — never a host port, never collides. This is
      # the SUITE database used by unit(skip)/integration/bdd/admin.
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp_test?sslmode=disable
      # E2E and UI must hit the SERVER's database (/adcp), not the suite DB. The
      # tox e2e/ui envs override DATABASE_URL from this var (host path leaves it
      # unset and keeps its own DATABASE_URL).
      E2E_DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      # bdd 5th transport (E2E_REST): real HTTP through the proxy to the live
      # server, with Given-step factory data written to the SERVER's DB so the
      # server sees it. E2E_BASE_URL = the in-network proxy; E2E_POSTGRES_URL =
      # the server DB (/adcp). BDD_E2E_ENABLED=true adds the e2e_rest transport to
      # the bdd parametrization (was off everywhere — needs this Docker stack).
      BDD_E2E_ENABLED: "${BDD_E2E_ENABLED:-true}"
      E2E_BASE_URL: http://proxy:8000
      E2E_POSTGRES_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      # The TLS listener is ADDITIVE: E2E_BASE_URL above keeps its plaintext
      # value (487 bdd_e2e + 95 e2e tests target it), and these two name the
      # SECOND origin for the scenarios that need a real handshake. The CA path
      # is ABSOLUTE — pytest does not always run from the repo root, and /app IS
      # the repo root here (the `.:/app` bind mount), so the runner reads the
      # very file the generator wrote on the host.
      E2E_TLS_BASE_URL: ${E2E_TLS_BASE_URL:-https://proxy.adcp.test:8443}
      E2E_CA_BUNDLE: /app/.test-tls/ca.pem
      # The slice the allocator handed this stack (salesagent-mp53.9). The host
      # side uses it to CREATE the network; the runner needs it to ASSERT on it —
      # tests/e2e/test_webhook_capture_egress_gate_e2e.py checks that the capture
      # hostname resolves INTO this stack's own subnet, which is what
      # distinguishes "the gate accepted a genuinely non-private address" from
      # "something answered". Without this line the value exists on the host and
      # is invisible in here, and that assertion cannot run at all.
      E2E_NETWORK_SUBNET: ${E2E_NETWORK_SUBNET:-}
      # Suites that hit the running server reach it in-network (no host port).
      ADCP_SERVER_URL: http://proxy:8000
      ADCP_SALES_PORT: "8000"
      # e2e/ui address the server by service name (proxy) and the server DB by
      # service name (postgres:5432) — resolved by conftest via these vars.
      ADCP_TEST_HOST: proxy
      ADCP_TEST_DB_HOST: postgres
      ADCP_TEST_DB_PORT: "5432"
      # Webhook readback control-plane (GH #1299): the runner reaches
      # the long-lived webhook-capture service by SERVICE NAME on the compose
      # network, same pattern as reaching postgres:5432 — no published port,
      # no network alias needed. Delivery (the server calling back) is
      # separate and always goes through the shared tls-proxy front at the
      # fixed webhooks.adcp.test:8443 alias, never this var.
      WEBHOOK_CAPTURE_HOST: webhook-capture
      WEBHOOK_CAPTURE_PORT: "8080"
      # Pinned reference creative agent, reachable in-network by service name
      # (no host :9999). Clears the 18 test_creative_agent_live integration tests.
      # https, via the shared tls-proxy front above — the runner dials the same
      # origin the SERVER does, and a `*.adcp.test` value that is not
      # https://...:8443 is a guard failure
      # (tests/unit/test_architecture_e2e_compose_tls_origins.py).
      CREATIVE_AGENT_URL: https://creative-agent.adcp.test:8443/api/creative-agent
      # PLAYWRIGHT_BROWSERS_PATH used to sit here, overriding Dockerfile.test's
      # baked /ms-playwright; it was DELETED (not moved) when the `user:` pin
      # went away -- see the HOME/UV_CACHE_DIR note at the top of this block.
      # There must be exactly ZERO of that key in this mapping now, and never
      # two: a duplicate once existed here and was not merely redundant -- YAML
      # last-wins meant the stale entry silently overrode the intended one, so
      # the fix looked applied and was not, and newer `docker compose` rejects
      # the file outright with "mapping key PLAYWRIGHT_BROWSERS_PATH already
      # defined".
      # bdd runs truly serial in-network: -n0 (no xdist subprocess). Two reasons:
      # (1) all bdd workers share ONE live Postgres in e2e mode -> xdist races; and
      # (2) under xdist BDD_E2E_ENABLED doesn't reach the worker's collection, so
      # the e2e_rest 5th transport is silently dropped. -n0 collects in-process.
      BDD_XDIST_N: "${BDD_XDIST_N:-0}"
      # xdist distribution mode: loadfile (default; whole feature file -> one
      # worker) vs load (individual scenarios spread across workers). load
      # removes the big-file wall-time floor but requires scenarios to be
      # independent (no intra-file prerequisite coupling).
      BDD_DIST: "${BDD_DIST:-loadfile}"
      # Integration/unit xdist worker counts (0/unset = serial). Plumbed so the
      # box fast-profile (INTEGRATION_XDIST_N=auto) actually reaches pytest inside
      # the runner container. integration_db creates a uuid-named DB per test, so
      # parallel workers never share rows -> race-free.
      #
      # UNIT_XDIST_N defaults to `auto`, NOT 0. It was 0 because unit "flaked"
      # under xdist; the flake had a single cause, now fixed -- a leaked
      # patch("os.getpid") put a MagicMock in every LogRecord.process, which
      # pytest-json-report copied onto the report and execnet could not
      # serialize, killing the worker and truncating the session behind a
      # summary that read "0 failed" (see tests/_xdist_report_safety.py).
      #
      # The value matters, not just the default: compose ALWAYS sets a listed
      # key, so `${UNIT_XDIST_N:-0}` here made tox.ini's own
      # `-n {env:UNIT_XDIST_N:auto}` unreachable -- the tox default is consulted
      # only when the variable is UNSET, and this line guarantees it is set.
      # Leaving it at 0 would have made the tox flip a silent no-op in the only
      # environment that runs the full suite. `:-auto` keeps the override working
      # while making the in-network default match tox's.
      INTEGRATION_XDIST_N: "${INTEGRATION_XDIST_N:-0}"
      UNIT_XDIST_N: "${UNIT_XDIST_N:-auto}"
      # Opt-in fast per-test DB path: clone from a schema template (default off).
      # TEST_DB_SKIP_DROP additionally skips the per-test DROP — safe ONLY on a
      # throwaway (tmpfs) Postgres, where clones are wiped on container restart;
      # off elsewhere so template mode never leaks DBs on a persistent Postgres.
      TEST_DB_TEMPLATE: "${TEST_DB_TEMPLATE:-}"
      TEST_DB_SKIP_DROP: "${TEST_DB_SKIP_DROP:-}"
      # bdd is the only suite using `pytest -n auto`. It MUST run serial in-network:
      # all bdd workers share ONE Postgres (postgres:5432/adcp_test), and the
      # factory-boy fixtures create tenants/principals with fixed IDs, so >1 worker
      # races on shared rows -> a large block of setup ERRORS (non-deterministic;
      # it happened to pass with 4 workers on the dev branch, then failed hard on a
      # clean main run). Pinning auto=1 serializes DB access -> deterministic green
      # (verified: 1451 passed / 5122 xfailed / 0 errors). Also keeps memory bounded
      # (the bare `-n auto` would otherwise spawn ~17 app-loading workers -> OOM).
      PYTEST_XDIST_AUTO_NUM_WORKERS: "${PYTEST_XDIST_AUTO_NUM_WORKERS:-1}"
      ADCP_TESTING: "true"
      ADCP_AUTH_TEST_MODE: "true"
      # ─── Outbound egress escape hatch — TEST STACK ONLY ─────────────────────
      # Same reason as the adcp-server entry above, for the calls the RUNNER
      # makes itself: http://proxy:8000 (E2E_BASE_URL, the e2e_rest transport)
      # is dialed with a raw httpx client (tests/harness/dispatchers.py), NOT
      # through this seam — this hatch is not what makes that one work. It
      # stays open here for the LocalOrigin-backed integration suites that DO
      # dial through the seam (now against the https local_origin_tls fixture,
      # GH #1757, so it is the ADDRESS gate this opens, not scheme —
      # there is no scheme hatch left anywhere). The creative-agent origin
      # (CREATIVE_AGENT_URL) needs no hatch at all: it is https via the shared
      # tls-proxy front. tox only forwards this to pytest
      # because it is listed in tox.ini pass_env. See the adcp-server entry for
      # why docker-compose.yml is left alone, and for the constraint this
      # places on refusal grading (private-range refusal cannot happen in this
      # stack; it stays in-process via the set_flags monkeypatch).
      ADCP_OUTBOUND_ALLOW_PRIVATE: "true"
      # Same trust anchor as the adcp-server entry (combined-ca.pem, not ca.pem
      # alone — see that entry's comment) — this service also dials the
      # creative-agent https front directly (test_creative_agent_live.py), AND
      # runs `uv sync` against real pypi.org during tox provisioning, which
      # needs the public roots this combined file still carries.
      SSL_CERT_FILE: /app/.test-tls/combined-ca.pem
      CREATE_SAMPLE_DATA: "true"
      DELIVERY_WEBHOOK_INTERVAL: "5"
      # The source is bind-mounted, so the host's in-tree __pycache__ comes with
      # it — and those .pyc embed host absolute paths in co_filename, which makes
      # pytest-bdd's scenarios() resolve feature files to /Users/... instead of
      # /app/... (FileNotFoundError). Redirect bytecode to a container-local dir
      # so Python recompiles from /app and paths resolve correctly.
      PYTHONPYCACHEPREFIX: /tmp/pycache
      GEMINI_API_KEY: ${GEMINI_API_KEY:-test_key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-PEg0SNGQyvzi4Nft-ForSzK8AGXyhRtql1MgoUsfUHk=}  # TEST ONLY — never use in production
    depends_on:
      postgres:
        condition: service_healthy
      creative-agent:
        condition: service_healthy
      webhook-capture:
        condition: service_healthy
    extra_hosts:
      # BLACKHOLE the live public creative agent (see the adcp-server entry):
      # a runner-side leak fails instantly instead of flaking on a 429.
      - "creative.adcontextprotocol.org:127.0.0.1"
    # Fix the Docker embedded-DNS concurrent-lookup race (moby/moby#22142): under
    # the e2e suite's connection churn, glibc fires the A and AAAA queries in
    # parallel over one UDP socket to 127.0.0.11 and one response gets dropped,
    # so getaddrinfo('proxy') intermittently returns EAI_NONAME ("Name or service
    # not known") — the flaky tenant-isolation failures. single-request-reopen
    # makes glibc issue the two queries sequentially on separate sockets, removing
    # the race. (Host runs use localhost, so they never hit DNS at all.)
    dns_opt:
      - single-request-reopen
    # No network alias needed here anymore (GH #1299 deleted the last
    # consumer, ADCP_WEBHOOK_HOST) — this runner reaches every other service it
    # needs (postgres, proxy, webhook-capture) by plain service name, same as
    # postgres:5432 above.
    volumes:
      - .:/app
      # Restored with the removal of the `user:` pin above (Aug 2026), matching
      # main. It had been dropped because a fresh named volume's mountpoint is
      # created root:root by the daemon before the container process starts,
      # which EACCES-blocked a NON-ROOT tests user from `mkdir .tox/<env>`.
      # That failure was a consequence of the pin, not of the volume: at the
      # image default the mountpoint is writable, and .tox stays off the
      # bind-mounted host tree where its ownership was never anyone's to fight
      # over -- which is the same principle ADCP_LOG_DIR applies to the server's
      # logs above.
      #
      # LOAD-BEARING, and not only for ownership: run_all_tests.sh reads the
      # per-suite JSON reports OUT of this volume
      # (`docker run -v "${COMPOSE_PROJECT_NAME}_tox_data:/t:ro" ... cp /t/*.json`).
      # Remove the mount and that extraction silently copies whatever stale
      # ./.tox JSON the host happens to hold, emitting a fresh timestamped
      # results directory full of a PREVIOUS run's green numbers -- observed
      # live on two runs that executed zero suites. The mount and that
      # extraction have to move together.
      - tox_data:/app/.tox  # keep tox envs off the bind-mounted host tree
    working_dir: /app
    # venv lives at /opt/venv (UV_PROJECT_ENVIRONMENT in Dockerfile.test), outside
    # the /app bind mount, so it is never shadowed — no .venv anonymous volume.
    # Overridden by `docker compose run --rm tests <cmd>`; idle by default.
    command: ["sleep", "infinity"]

  # ─── Pinned reference creative agent (in-network) ──────────────────────────
  # Mirror of scripts/creative-agent-stack.sh, but ON the compose network with
  # NO published host port. The host path runs that script standalone (creative-net,
  # :9999); in-network we reuse the SAME pre-built image (`adcp-creative-agent`,
  # adcp@ADCP_PIN from that script) so CI/host/in-network cannot diverge on the pin. The
  # image is built by `scripts/creative-agent-stack.sh build` before `up`
  # (run_all_tests.sh for the in-network path; tests/e2e/conftest.py for the
  # host-side standalone path). NOT profile-gated: the SERVER resolves format
  # specs against this agent (CREATIVE_AGENT_URL) and the live public host is
  # blackholed, so every e2e `up` needs it.
  creative-pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adcp_registry
      POSTGRES_USER: adcp
      POSTGRES_PASSWORD: localdev
    volumes:
      - creative_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcp -d adcp_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  creative-agent:
    image: adcp-creative-agent  # built by scripts/creative-agent-stack.sh build
    environment:
      # NOT production: since adcp v3.1.1 the agent refuses to start with the
      # DEV_USER_* auth bypass (which the test harness needs) in a
      # production-shaped env (NODE_ENV=production). Mirrors
      # scripts/creative-agent-stack.sh cmd_up.
      NODE_ENV: development
      PORT: "8080"
      DATABASE_URL: postgresql://adcp:localdev@creative-pg:5432/adcp_registry
      RUN_MIGRATIONS: "true"
      ALLOW_INSECURE_COOKIES: "true"
      DEV_USER_EMAIL: ci@test.com
      DEV_USER_ID: ci-user
      AGENT_TOKEN_ENCRYPTION_SECRET: local-ci-encryption-key-32chars!!
      WORKOS_API_KEY: sk_test_dummy
      WORKOS_CLIENT_ID: client_dummy
    depends_on:
      creative-pg:
        condition: service_healthy
    # Node is guaranteed in this image; curl/wget may not be. Use node http.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/creative-agent/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Long-lived webhook receiver for the e2e stack (salesagent-mp53.9). Runs the
  # stdlib-only capture service on a BARE python image: Dockerfile.test bakes a
  # multi-minute playwright/chromium install this service has no use for, and
  # tests/e2e/webhook_capture_service.py is deliberately import-free of
  # tests.helpers.* so a bare image can run it (that package's __init__ pulls in
  # factory-boy, which is not installed here).
  #
  # It speaks PLAINTEXT and is never dialled directly by the server: deliveries
  # arrive through the shared tls-proxy front at https://webhooks.adcp-e2e.dev:8443,
  # which terminates TLS and forwards here by SNI. That is the whole point of the
  # ticket — the server reaches a real HTTPS origin on a NON-PRIVATE address, so
  # production's SSRF gate accepts it on its own terms with nothing patched.
  webhook-capture:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "tests.e2e.webhook_capture_service"]
    environment:
      PORT: "8080"
      # Reported by GET /health so a readback client can prove it is talking to
      # its OWN stack rather than a cross-wired sibling on the same host port.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-adcp-e2e}
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Static counterparty identity origin for the inbound signing walk
  # (salesagent-mp53.8). A SIBLING of webhook-capture, not a mode inside it: what
  # would be shared is ~30 lines of BaseHTTPRequestHandler, while the coupling
  # would be real — that service's other mode records raw bytes for the signing
  # suite and its do_POST semantics must not bleed into an identity origin.
  #
  # Serves the three hops async_resolve_agent walks (capabilities ->
  # brand_json_url -> brand.json -> jwks_uri -> JWKS) as plain GETs, because
  # _fetch_capabilities does a raw GET with follow_redirects=False and demands a
  # 200 JSON object — which is exactly why the seller's OWN trust root cannot
  # stand in as the counterparty: our /mcp answers GET with an SSE redirect.
  counterparty-origin:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "tests.e2e.counterparty_origin_service"]
    environment:
      PORT: "8080"
      # Every absolute URL this origin publishes about ITSELF must be the name
      # the SERVER dials, not the container-internal address it binds — a
      # mismatch here sends hop 2 or 3 somewhere unreachable and surfaces as an
      # unresolvable key three assertions later.
      COUNTERPARTY_PUBLIC_ORIGIN: https://counterparty.adcp-e2e.dev:8443
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-adcp-e2e}
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Declaring the network is what makes production's SSRF gate PASSABLE rather
  # than something the stack has to be exempted from. Docker's default bridge
  # hands out 172.16/12 addresses, which check_url_ssrf refuses outright
  # (url_validator.py BLOCKED_NETWORKS) — so no hostname, alias or certificate
  # could ever make an in-stack receiver reachable while the gate stayed armed.
  #
  # TEMPLATED, never a literal: `docker network create --subnet 223.255.255.0/24`
  # succeeds once and the SECOND stack on the box fails with "Pool overlaps with
  # other one on this address space" — even for a /28 inside the held /24. This
  # repo runs stacks concurrently BY DESIGN (scripts/test-stack.sh sets
  # COMPOSE_PROJECT_NAME="adcp-test-$$"), so the allocator hands each stack a
  # DISJOINT slice the same way it hands out host ports.
  #
  # SIZED FROM THE PEAK CONTAINER COUNT, not guessed. A full run is NOT the 8
  # services below: run_all_tests.sh provisions per-worker stacks when
  # E2E_WORKERS>0, and salesagent-remote-run defaults it to 8 on the CI box. Each
  # worker adds TWO containers (`-server-gwN` and `-tls-gwN.adcp.test`), so peak
  # is 8 + 2*8 = 24 containers plus the gateway.
  #   /28 -> 13 usable  — TOO SMALL, fails partway into a full run
  #   /27 -> 29 usable  — fits 24, only 5 spare
  #   /26 -> 61 usable  — fits with headroom; 4 concurrent stacks per /24
  # /26 is the default because a stack that dies at container 14 of a 20-minute
  # run costs far more than the concurrency. Raise E2E_WORKERS and this must be
  # re-sized: the failure mode is an address-exhaustion error from Docker, not a
  # test failure.
  #
  # 223.255.255.0/24 is APNIC's Debogon Project prefix — the last /24 of 223/8,
  # held back by RFC 3330 §3 as "Reserved but subject to allocation" and
  # retained unassigned by APNIC for debogon measurement when IANA delegated
  # 223/8 to it. APNIC's RDAP entry names it `Debogon-prefix` (registrant APNIC
  # Pty Ltd) and RIPE RIS sees it announced by 0 of 325 peers, so squatting it
  # in this container network namespace shadows no real destination. The pool
  # and the /26 slicing live in scripts/dev/alloc-e2e-subnet.sh; that file
  # carries the full derivation, including why the entire IANA IPv4
  # Special-Purpose registry is now unusable here.
  #
  # It is NOT 192.88.99.0/24 (6to4 anycast, RFC 7526) any more: GH #1802 added
  # that range to EgressPolicy._SUPPLEMENT_NETWORKS, which _blocked_address
  # checks UNCONDITIONALLY — ahead of and outside the
  # ADCP_OUTBOUND_ALLOW_PRIVATE hatch — so all 256 of its addresses are now
  # refused under every posture, and a stack sitting on it would fail exactly
  # the in-network accept-case tests this subnet exists to make gradeable.
  # Fix that by moving the stack, never by trimming the supplement list.
  #
  # KNOWN AND ACCEPTED COST: with the network non-private, other in-stack
  # services (postgres:5432, tests:8080) also become addresses the gate accepts,
  # so this stack does NOT grade "a webhook aimed at another service on my own
  # network is refused". That loss is bounded to this one slice. The alternative
  # considered and rejected FOR THIS PURPOSE was an ADCP_OUTBOUND_ALLOW_PRIVATE
  # env hatch, which opens 127.0.0.1, host.docker.internal and all of RFC1918
  # for whatever sets it — unbounded, and the exact shape
  # tests/unit/test_architecture_no_private_destinations.py exists to catch.
  #
  # MERGE NOTE (GH #1802): that hatch nonetheless IS set on `adcp-server` and
  # `tests` above, and the two are not in conflict — they answer different
  # questions. The hatch is what lets the RUNNER dial the LocalOrigin fixtures
  # it binds on loopback inside its own container (tests/helpers/
  # local_http_origin.py, tests/integration/test_local_http_origin_tls.py):
  # 127.0.0.1 is private under any subnet this network could be given. This
  # non-private subnet is what lets the compose-network origins — the webhook
  # capture and the counterparty — be accepted by the gate ON THEIR OWN TERMS,
  # which the hatch would only have papered over. Keep both: dropping the
  # subnet does not restore the refusal grading the hatch already relaxes, and
  # dropping the hatch breaks the loopback-origin suites.
  default:
    ipam:
      config:
        - subnet: ${E2E_NETWORK_SUBNET:-223.255.255.0/26}

volumes:
  creative_pg_data:
  # Destroyed and recreated by cleanup's `dc down -v` every run, so it persists
  # nothing across runs by design -- its job is to keep .tox OFF the bind mount,
  # not to cache anything.
  tox_data:
