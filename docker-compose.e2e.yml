# Docker Compose for E2E tests
#
# Builds from source and exposes services via nginx proxy for production-like testing.
# Used by tests/e2e/conftest.py to run the full test suite.
#
# All services (MCP, A2A, Admin) run in a single FastAPI process behind nginx.
#
# Usage:
#   docker compose -f docker-compose.e2e.yml up -d
#
# Port configuration (via environment variables):
#   ADCP_SALES_PORT - Nginx proxy port (default: 8092, proxies to adcp-server:8080)
#   POSTGRES_PORT   - PostgreSQL port (default: 5435)

services:
  postgres:
    image: postgres:17-alpine
    # Throwaway test DB: ~79% of BDD wall time is CREATE DATABASE + DDL + writes
    # (per-test isolated DBs). Putting PGDATA on tmpfs (RAM) makes template
    # copies and DDL RAM-fast — this is the actual speed win, not durability
    # flags (on tmpfs, fsync/synchronous_commit are moot: there is no disk to
    # flush). Data is recreated every run and never persisted. max_connections
    # is raised for many parallel xdist workers. tmpfs size via PGDATA_TMPFS_SIZE.
    command:
      - postgres
      - -c
      - max_connections=300
    environment:
      POSTGRES_DB: adcp
      POSTGRES_USER: adcp_user
      POSTGRES_PASSWORD: secure_password_change_me
    tmpfs:
      - /var/lib/postgresql/data:size=${PGDATA_TMPFS_SIZE:-10g}
    # NO host port here — publishing lives in docker-compose.e2e.ports.yml, which
    # only the HOST paths overlay (conftest standalone branch, test-stack.sh). The
    # in-network runner uses this base file alone and reaches Postgres by service
    # name (postgres:5432), so it publishes ZERO host ports and many stacks can
    # run concurrently without a port collision.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcp_user -d adcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  adcp-server:
    build: .
    environment:
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      # Pin strict schema validation (extra="forbid") for the e2e_rest boundary so
      # the live server rejects spec-invalid input the same way the dev/test
      # transports do. is_production() defaults to "development" already, but make
      # it explicit so a future Dockerfile/env change can't silently flip the
      # boundary to production's lenient extra="ignore". (salesagent-hm9q)
      ENVIRONMENT: development
      SKIP_NGINX: "true"
      SKIP_CRON: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      ADCP_TESTING: ${ADCP_TESTING:-true}
      ADCP_AUTH_TEST_MODE: ${ADCP_AUTH_TEST_MODE:-true}
      # Must match the `tests` service's ADCP_WEBHOOK_HOST below: this is the
      # SERVER's own trusted-test-host allowlist entry for outbound webhook SSRF
      # validation (WebhookURLValidator._is_trusted_test_host), not just the
      # runner's callback-URL construction. Without it here, every webhook the
      # server tries to send to the e2e capture server (http://tests/webhook,
      # which DNS-resolves to a private compose-network IP) is rejected by the
      # SSRF gate even under ADCP_TESTING=true, because the gate only trusts
      # literal localhost/127.0.0.1 plus whatever ADCP_WEBHOOK_HOST names --
      # and this service never saw that name.
      ADCP_WEBHOOK_HOST: tests
      # The SERVER must know about the pinned in-network creative agent: sync/
      # create flows resolve format specs server-side, and references carry the
      # PUBLIC canonical agent_url — without this, the registry's connection
      # alias has nothing to route to and the server calls the LIVE public host,
      # which rate-limits under CI load (salesagent-9qe2). The runner service
      # already sets the same value for the direct integration tests.
      CREATIVE_AGENT_URL: http://creative-agent:8080/api/creative-agent
      CREATE_DEMO_TENANT: "true"
      # The LIVE server needs the same signing KEK the dev stack has (#1291 D1).
      # A scenario's Given mints a tenant signing key through production, which
      # stores the private PEM encrypted under this KEK; the server then has to
      # DECRYPT it to derive webhook_signing.supported. Without these two lines the
      # server cannot open a key the runner just minted, derives supported=false,
      # and the e2e_rest leg of every key-dependent capability row fails against a
      # key that genuinely exists — a failure that no in-process run can reproduce,
      # because only e2e_rest crosses into this container.
      # Same worthless value as docker-compose.yml, and for the same reason.
      # The trust store for this server's OUTBOUND counterparty walk
      # (salesagent-mp53.8). The inbound verifier resolves an unknown signer by
      # fetching capabilities -> brand.json -> JWKS from the counterparty over
      # the stack's own TLS front, and the SDK builds that client with a bare
      # ssl.create_default_context() per hop — trust_env=False on its httpx
      # clients is an httpx-level flag and provably cannot reach it, so only the
      # OpenSSL env vars do. Without this the walk dies at certificate
      # verification and surfaces as capabilities_unreachable, i.e. a SILENT
      # request_signature_key_unknown.
      #
      # The file is the CONCATENATED bundle (public roots + our test CA), emitted
      # by gen_test_tls.py so it stays in step with the CA it trusts, and already
      # visible in here through the .:/app mount below. Verification stays fully
      # ON against a real CA — this is the receiver-side twin of the runner's
      # E2E_CA_BUNDLE, not a hatch, and it is NOT the private-destination pin
      # (that one has no env reader by design — see
      # tests/unit/test_architecture_no_private_destinations.py).
      SSL_CERT_FILE: /app/.test-tls/ca-bundle.pem
      ADCP_SIGNING_KEY_PASSPHRASE_ENV: "ADCP_SIGNING_DEV_KEK"
      ADCP_SIGNING_DEV_KEK: "dev-only-signing-kek-not-a-secret"
      DELIVERY_WEBHOOK_INTERVAL: ${DELIVERY_WEBHOOK_INTERVAL:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-PEg0SNGQyvzi4Nft-ForSzK8AGXyhRtql1MgoUsfUHk=}  # TEST ONLY — never use in production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SALES_AGENT_DOMAIN: "sales-agent.example.com"
      ADCP_MULTI_TENANT: "true"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # BLACKHOLE the live public creative agent: tests must NEVER depend on it
      # (its catalog drifts and it rate-limits under CI load — salesagent-9qe2,
      # salesagent-kczg). The registry aliases this host to the pinned in-network
      # agent; if any code path regresses and connects to it verbatim, this makes
      # it fail INSTANTLY (connection refused) instead of flaking on a 429.
      - "creative.adcontextprotocol.org:127.0.0.1"
    # Same Docker embedded-DNS concurrent-lookup race fix as the runner — the
    # server resolves postgres/creative-agent and the webhook callback host.
    dns_opt:
      - single-request-reopen
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  proxy:
    image: nginx:stable
    volumes:
      - ./config/nginx/nginx-development.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - adcp-server
    # NO host port here either — see the postgres note above. Publishing for the
    # host paths is in docker-compose.e2e.ports.yml; the in-network runner reaches
    # the proxy by service name (proxy:8000).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── TLS listener (salesagent-tgzb) ────────────────────────────────────────
  # ADDITIVE, never a migration: `proxy` above keeps its plaintext :8000 exactly
  # as it is, and E2E_BASE_URL still points there. This is a SECOND listener, on
  # a SECOND port, at a DOTTED name — the one thing the plaintext stack cannot
  # provide. `_get_protocol_for_domain` answers https for `proxy.adcp.test:8443`
  # because the name has a dot and is not loopback; this service is what makes
  # that answer true rather than merely asserted.
  #
  # Stock nginx:stable — the entrypoint renders /etc/nginx/templates/*.template
  # into conf.d with envsubst, so ${TLS_UPSTREAM} is per-instance and no custom
  # image is needed. Per-worker bdd_e2e sidecars run this same service with their
  # own upstream (see run_all_tests.sh).
  #
  # The certificate must exist BEFORE `up`: every entry point calls
  # scripts/dev/ensure-test-tls.sh first (test-stack.sh, run_all_tests.sh,
  # tests/e2e/conftest.py). Without it the bind mount below would materialise an
  # empty directory and nginx would fail to start.
  tls-proxy:
    image: nginx:stable
    environment:
      TLS_UPSTREAM: ${TLS_UPSTREAM:-adcp-server:8080}
    volumes:
      - ./config/nginx/nginx-tls-test.conf.template:/etc/nginx/templates/tls-test.conf.template:ro
      - ./.test-tls:/app/.test-tls:ro
    depends_on:
      - adcp-server
    networks:
      default:
        # A dotted alias is the whole mechanism for the SHARED stack. (The
        # per-worker sidecars cannot use one — `docker compose run` has no
        # --network-alias — so they carry a dotted CONTAINER NAME instead.)
        aliases:
          - proxy.adcp.test
          # The e2e webhook-capture origin (salesagent-mp53.9). An ALIAS on the
          # existing front, never a second `listen ... ssl` service: one
          # terminator, one certificate, one place to keep in step. SNI decides
          # which upstream a connection reaches — see the $ssl_server_name map in
          # config/nginx/nginx-tls-test.conf.template.
          - webhooks.adcp-e2e.dev
          # The counterparty identity origin (salesagent-mp53.8). Another SNI
          # alias on the SAME front — see the $ssl_server_name map. Unlike the
          # webhook receiver this one may sit under .adcp.test: the reserved-TLD
          # gate lives on the outbound WEBHOOK path (notification_proof_service),
          # and the inbound counterparty walk is gated by SDK address arithmetic
          # alone (resolve_and_validate_host applies no TLD rule). So it needs no
          # new SAN — *.adcp.test already covers it.
          - counterparty.adcp-e2e.dev
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/app/.test-tls/ca.pem", "https://proxy.adcp.test:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-network test runner (Option 1). Reaches Postgres/the server by SERVICE
  # NAME on the compose network — postgres:5432, proxy:8000 — so it needs NO
  # published host ports. Each `docker compose -p <project>` gets its own
  # isolated network, so `postgres` here can never collide with another stack's
  # `postgres`. This removes the host-port TOCTOU race that scripts/test-stack.sh
  # hits when guessing free ports in 50000-60000 under a crowded Docker host.
  #
  # Gated behind a profile so a normal `up` does not start it; the runner is
  # launched explicitly via `docker compose run --rm tests ...`
  # (see run_all_tests.sh).
  tests:
    profiles: ["runner"]
    # NO `user:` pin, deliberately -- back to main's shape (Aug 2026).
    #
    # The pin was added to stop the container writing test-results/.tox/schemas/
    # logs into the bind-mounted /app as literal root, on the premise that there
    # is "no userns-remap on these hosts, so container root IS host root". That
    # premise no longer holds where it matters: the CI box runs ROOTLESS docker,
    # where container root already maps to the invoking user, so the pin bought
    # nothing there. Worse, it derived its value from `id -u` inside a
    # supervisor that runs as root -- resolving to 0:0, i.e. exactly the image
    # default it was written to override.
    #
    # What it did cost was real. Being non-root forced three separate
    # workarounds for image paths owned by root (HOME/UV_CACHE_DIR,
    # PLAYWRIGHT_BROWSERS_PATH -- the last re-downloading 113 MiB of chromium
    # every run because the baked copy was unreachable), and it is why the
    # tox_data volume had to be dropped: a fresh named volume's mountpoint is
    # created root:root by the daemon before the container starts, which EACCES-
    # blocks a non-root user from `mkdir .tox/<env>`. Running as root makes that
    # mountpoint writable again, so the volume comes back below and .tox leaves
    # the bind mount -- which was the pin's own stated reason for existing.
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      # HOME, UV_CACHE_DIR and PLAYWRIGHT_BROWSERS_PATH overrides removed with
      # the `user:` pin above (Aug 2026). All three existed solely to route
      # around image paths owned by root (/cache/uv, /ms-playwright) that a raw
      # numeric non-root UID could not write. As root those are writable again,
      # and dropping PLAYWRIGHT_BROWSERS_PATH restores the chromium baked in at
      # build time instead of re-downloading it into /tmp on every run.
      #
      # Unbuffered so pytest's progress reaches the run log as it happens rather
      # than in block-sized bursts: the supervisor log IS the only live view of
      # a detached run, and a buffered stream makes a working run look wedged
      # and a wedged one look busy.
      PYTHONUNBUFFERED: "1"
      # Fixed in-network DB address — never a host port, never collides. This is
      # the SUITE database used by unit(skip)/integration/bdd/admin.
      DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp_test?sslmode=disable
      # E2E and UI must hit the SERVER's database (/adcp), not the suite DB. The
      # tox e2e/ui envs override DATABASE_URL from this var (host path leaves it
      # unset and keeps its own DATABASE_URL).
      E2E_DATABASE_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      # bdd 5th transport (E2E_REST): real HTTP through the proxy to the live
      # server, with Given-step factory data written to the SERVER's DB so the
      # server sees it. E2E_BASE_URL = the in-network proxy; E2E_POSTGRES_URL =
      # the server DB (/adcp). BDD_E2E_ENABLED=true adds the e2e_rest transport to
      # the bdd parametrization (was off everywhere — needs this Docker stack).
      BDD_E2E_ENABLED: "${BDD_E2E_ENABLED:-true}"
      E2E_BASE_URL: http://proxy:8000
      E2E_POSTGRES_URL: postgresql://adcp_user:secure_password_change_me@postgres:5432/adcp?sslmode=disable
      # The TLS listener is ADDITIVE: E2E_BASE_URL above keeps its plaintext
      # value (487 bdd_e2e + 95 e2e tests target it), and these two name the
      # SECOND origin for the scenarios that need a real handshake. The CA path
      # is ABSOLUTE — pytest does not always run from the repo root, and /app IS
      # the repo root here (the `.:/app` bind mount), so the runner reads the
      # very file the generator wrote on the host.
      E2E_TLS_BASE_URL: ${E2E_TLS_BASE_URL:-https://proxy.adcp.test:8443}
      E2E_CA_BUNDLE: /app/.test-tls/ca.pem
      # The slice the allocator handed this stack (salesagent-mp53.9). The host
      # side uses it to CREATE the network; the runner needs it to ASSERT on it —
      # tests/e2e/test_webhook_capture_egress_gate_e2e.py checks that the capture
      # hostname resolves INTO this stack's own subnet, which is what
      # distinguishes "the gate accepted a genuinely non-private address" from
      # "something answered". Without this line the value exists on the host and
      # is invisible in here, and that assertion cannot run at all.
      E2E_NETWORK_SUBNET: ${E2E_NETWORK_SUBNET:-}
      # Suites that hit the running server reach it in-network (no host port).
      ADCP_SERVER_URL: http://proxy:8000
      ADCP_SALES_PORT: "8000"
      # e2e/ui address the server by service name (proxy) and the server DB by
      # service name (postgres:5432) — resolved by conftest via these vars.
      ADCP_TEST_HOST: proxy
      ADCP_TEST_DB_HOST: postgres
      ADCP_TEST_DB_PORT: "5432"
      # Webhook reverse-addressing: the server calls back to this runner by its
      # network alias (requires `docker compose run --use-aliases`). 'tests' is
      # not 'localhost', so the server does NOT rewrite it to host.docker.internal.
      ADCP_WEBHOOK_HOST: tests
      # Pinned reference creative agent, reachable in-network by service name
      # (no host :9999). Clears the 18 test_creative_agent_live integration tests.
      CREATIVE_AGENT_URL: http://creative-agent:8080/api/creative-agent
      # PLAYWRIGHT_BROWSERS_PATH moved UP in this same environment block (Aug 2026)
      # when the runner stopped running as root. The duplicate key that briefly
      # existed here was not merely redundant: YAML last-wins meant this stale
      # entry silently overrode the new one, so the fix looked applied and was not
      # — and newer `docker compose` rejects the file outright with
      # "mapping key PLAYWRIGHT_BROWSERS_PATH already defined".
      # bdd runs truly serial in-network: -n0 (no xdist subprocess). Two reasons:
      # (1) all bdd workers share ONE live Postgres in e2e mode -> xdist races; and
      # (2) under xdist BDD_E2E_ENABLED doesn't reach the worker's collection, so
      # the e2e_rest 5th transport is silently dropped. -n0 collects in-process.
      BDD_XDIST_N: "${BDD_XDIST_N:-0}"
      # xdist distribution mode: loadfile (default; whole feature file -> one
      # worker) vs load (individual scenarios spread across workers). load
      # removes the big-file wall-time floor but requires scenarios to be
      # independent (no intra-file prerequisite coupling).
      BDD_DIST: "${BDD_DIST:-loadfile}"
      # Integration/unit xdist worker counts (0/unset = serial). Plumbed so the
      # box fast-profile (INTEGRATION_XDIST_N=auto) actually reaches pytest inside
      # the runner container. integration_db creates a uuid-named DB per test, so
      # parallel workers never share rows -> race-free. UNIT_XDIST_N stays 0 by
      # default (unit -n auto has flaked); exposed for parity.
      INTEGRATION_XDIST_N: "${INTEGRATION_XDIST_N:-0}"
      UNIT_XDIST_N: "${UNIT_XDIST_N:-0}"
      # Opt-in fast per-test DB path: clone from a schema template (default off).
      # TEST_DB_SKIP_DROP additionally skips the per-test DROP — safe ONLY on a
      # throwaway (tmpfs) Postgres, where clones are wiped on container restart;
      # off elsewhere so template mode never leaks DBs on a persistent Postgres.
      TEST_DB_TEMPLATE: "${TEST_DB_TEMPLATE:-}"
      TEST_DB_SKIP_DROP: "${TEST_DB_SKIP_DROP:-}"
      # bdd is the only suite using `pytest -n auto`. It MUST run serial in-network:
      # all bdd workers share ONE Postgres (postgres:5432/adcp_test), and the
      # factory-boy fixtures create tenants/principals with fixed IDs, so >1 worker
      # races on shared rows -> a large block of setup ERRORS (non-deterministic;
      # it happened to pass with 4 workers on the dev branch, then failed hard on a
      # clean main run). Pinning auto=1 serializes DB access -> deterministic green
      # (verified: 1451 passed / 5122 xfailed / 0 errors). Also keeps memory bounded
      # (the bare `-n auto` would otherwise spawn ~17 app-loading workers -> OOM).
      PYTEST_XDIST_AUTO_NUM_WORKERS: "${PYTEST_XDIST_AUTO_NUM_WORKERS:-1}"
      ADCP_TESTING: "true"
      ADCP_AUTH_TEST_MODE: "true"
      CREATE_SAMPLE_DATA: "true"
      DELIVERY_WEBHOOK_INTERVAL: "5"
      # The source is bind-mounted, so the host's in-tree __pycache__ comes with
      # it — and those .pyc embed host absolute paths in co_filename, which makes
      # pytest-bdd's scenarios() resolve feature files to /Users/... instead of
      # /app/... (FileNotFoundError). Redirect bytecode to a container-local dir
      # so Python recompiles from /app and paths resolve correctly.
      PYTHONPYCACHEPREFIX: /tmp/pycache
      GEMINI_API_KEY: ${GEMINI_API_KEY:-test_key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-PEg0SNGQyvzi4Nft-ForSzK8AGXyhRtql1MgoUsfUHk=}  # TEST ONLY — never use in production
    depends_on:
      postgres:
        condition: service_healthy
      creative-agent:
        condition: service_healthy
    extra_hosts:
      # BLACKHOLE the live public creative agent (see the adcp-server entry):
      # a runner-side leak fails instantly instead of flaking on a 429.
      - "creative.adcontextprotocol.org:127.0.0.1"
    # Fix the Docker embedded-DNS concurrent-lookup race (moby/moby#22142): under
    # the e2e suite's connection churn, glibc fires the A and AAAA queries in
    # parallel over one UDP socket to 127.0.0.11 and one response gets dropped,
    # so getaddrinfo('proxy') intermittently returns EAI_NONAME ("Name or service
    # not known") — the flaky tenant-isolation failures. single-request-reopen
    # makes glibc issue the two queries sequentially on separate sockets, removing
    # the race. (Host runs use localhost, so they never hit DNS at all.)
    dns_opt:
      - single-request-reopen
    volumes:
      - .:/app
      # Restored with the removal of the `user:` pin above (Aug 2026), matching
      # main. It was dropped because a fresh named volume's mountpoint is
      # created root:root by the daemon before the container process starts,
      # which EACCES-blocked a NON-ROOT tests user from `mkdir .tox/<env>`.
      # That failure was a consequence of the pin, not of the volume: as root
      # the mountpoint is writable, and .tox stays off the bind-mounted host
      # tree where its ownership was never anyone's to fight over.
      - tox_data:/app/.tox  # keep tox envs off the bind-mounted host tree
    working_dir: /app
    # venv lives at /opt/venv (UV_PROJECT_ENVIRONMENT in Dockerfile.test), outside
    # the /app bind mount, so it is never shadowed — no .venv anonymous volume.
    # Overridden by `docker compose run --rm tests <cmd>`; idle by default.
    command: ["sleep", "infinity"]

  # ─── Pinned reference creative agent (in-network) ──────────────────────────
  # Mirror of scripts/creative-agent-stack.sh, but ON the compose network with
  # NO published host port. The host path runs that script standalone (creative-net,
  # :9999); in-network we reuse the SAME pre-built image (`adcp-creative-agent`,
  # adcp@ADCP_PIN from that script) so CI/host/in-network cannot diverge on the pin. The
  # image is built by `scripts/creative-agent-stack.sh build` before `up`
  # (run_all_tests.sh for the in-network path; tests/e2e/conftest.py for the
  # host-side standalone path). NOT profile-gated: the SERVER resolves format
  # specs against this agent (CREATIVE_AGENT_URL) and the live public host is
  # blackholed, so every e2e `up` needs it (salesagent-9qe2).
  creative-pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adcp_registry
      POSTGRES_USER: adcp
      POSTGRES_PASSWORD: localdev
    volumes:
      - creative_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adcp -d adcp_registry"]
      interval: 5s
      timeout: 5s
      retries: 10

  creative-agent:
    image: adcp-creative-agent  # built by scripts/creative-agent-stack.sh build
    environment:
      # NOT production: since adcp v3.1.1 the agent refuses to start with the
      # DEV_USER_* auth bypass (which the test harness needs) in a
      # production-shaped env (NODE_ENV=production). Mirrors
      # scripts/creative-agent-stack.sh cmd_up.
      NODE_ENV: development
      PORT: "8080"
      DATABASE_URL: postgresql://adcp:localdev@creative-pg:5432/adcp_registry
      RUN_MIGRATIONS: "true"
      ALLOW_INSECURE_COOKIES: "true"
      DEV_USER_EMAIL: ci@test.com
      DEV_USER_ID: ci-user
      AGENT_TOKEN_ENCRYPTION_SECRET: local-ci-encryption-key-32chars!!
      WORKOS_API_KEY: sk_test_dummy
      WORKOS_CLIENT_ID: client_dummy
    depends_on:
      creative-pg:
        condition: service_healthy
    # Node is guaranteed in this image; curl/wget may not be. Use node http.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/creative-agent/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Long-lived webhook receiver for the e2e stack (salesagent-mp53.9). Runs the
  # stdlib-only capture service on a BARE python image: Dockerfile.test bakes a
  # multi-minute playwright/chromium install this service has no use for, and
  # tests/e2e/webhook_capture_service.py is deliberately import-free of
  # tests.helpers.* so a bare image can run it (that package's __init__ pulls in
  # factory-boy, which is not installed here).
  #
  # It speaks PLAINTEXT and is never dialled directly by the server: deliveries
  # arrive through the shared tls-proxy front at https://webhooks.adcp-e2e.dev:8443,
  # which terminates TLS and forwards here by SNI. That is the whole point of the
  # ticket — the server reaches a real HTTPS origin on a NON-PRIVATE address, so
  # production's SSRF gate accepts it on its own terms with nothing patched.
  webhook-capture:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "tests.e2e.webhook_capture_service"]
    environment:
      PORT: "8080"
      # Reported by GET /health so a readback client can prove it is talking to
      # its OWN stack rather than a cross-wired sibling on the same host port.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-adcp-e2e}
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Static counterparty identity origin for the inbound signing walk
  # (salesagent-mp53.8). A SIBLING of webhook-capture, not a mode inside it: what
  # would be shared is ~30 lines of BaseHTTPRequestHandler, while the coupling
  # would be real — that service's other mode records raw bytes for the signing
  # suite and its do_POST semantics must not bleed into an identity origin.
  #
  # Serves the three hops async_resolve_agent walks (capabilities ->
  # brand_json_url -> brand.json -> jwks_uri -> JWKS) as plain GETs, because
  # _fetch_capabilities does a raw GET with follow_redirects=False and demands a
  # 200 JSON object — which is exactly why the seller's OWN trust root cannot
  # stand in as the counterparty: our /mcp answers GET with an SSE redirect.
  counterparty-origin:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "-m", "tests.e2e.counterparty_origin_service"]
    environment:
      PORT: "8080"
      # Every absolute URL this origin publishes about ITSELF must be the name
      # the SERVER dials, not the container-internal address it binds — a
      # mismatch here sends hop 2 or 3 somewhere unreachable and surfaces as an
      # unresolvable key three assertions later.
      COUNTERPARTY_PUBLIC_ORIGIN: https://counterparty.adcp-e2e.dev:8443
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-adcp-e2e}
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Declaring the network is what makes production's SSRF gate PASSABLE rather
  # than something the stack has to be exempted from. Docker's default bridge
  # hands out 172.16/12 addresses, which check_url_ssrf refuses outright
  # (url_validator.py BLOCKED_NETWORKS) — so no hostname, alias or certificate
  # could ever make an in-stack receiver reachable while the gate stayed armed.
  #
  # TEMPLATED, never a literal: `docker network create --subnet 192.88.99.0/24`
  # succeeds once and the SECOND stack on the box fails with "Pool overlaps with
  # other one on this address space" — even for a /28 inside the held /24. This
  # repo runs stacks concurrently BY DESIGN (scripts/test-stack.sh sets
  # COMPOSE_PROJECT_NAME="adcp-test-$$"), so the allocator hands each stack a
  # DISJOINT slice the same way it hands out host ports.
  #
  # SIZED FROM THE PEAK CONTAINER COUNT, not guessed. A full run is NOT the 8
  # services below: run_all_tests.sh provisions per-worker stacks when
  # E2E_WORKERS>0, and salesagent-remote-run defaults it to 8 on the CI box. Each
  # worker adds TWO containers (`-server-gwN` and `-tls-gwN.adcp.test`), so peak
  # is 8 + 2*8 = 24 containers plus the gateway.
  #   /28 -> 13 usable  — TOO SMALL, fails partway into a full run
  #   /27 -> 29 usable  — fits 24, only 5 spare
  #   /26 -> 61 usable  — fits with headroom; 4 concurrent stacks per /24
  # /26 is the default because a stack that dies at container 14 of a 20-minute
  # run costs far more than the concurrency. Raise E2E_WORKERS and this must be
  # re-sized: the failure mode is an address-exhaustion error from Docker, not a
  # test failure.
  #
  # 192.88.99.0/24 is IANA-allocated 6to4 relay anycast space, DEPRECATED by
  # RFC 7526 and no longer routed for its original purpose. Squatting it is
  # confined to this container network namespace and reaches no real host. It is
  # the least-bad choice available: every documentation range (192.0.2/24,
  # 198.51.100/24, 203.0.113/24), 240/4 and the RFC 2544 benchmarking range all
  # report is_private=True in Python's ipaddress and would be refused by the very
  # gate this exists to satisfy.
  #
  # KNOWN AND ACCEPTED COST: with the network non-private, other in-stack
  # services (postgres:5432, tests:8080) also become addresses the gate accepts,
  # so this stack does NOT grade "a webhook aimed at another service on my own
  # network is refused". That loss is bounded to this one slice. The alternative
  # considered and rejected was an ADCP_OUTBOUND_ALLOW_PRIVATE env hatch, which
  # would open 127.0.0.1, 169.254.169.254, host.docker.internal and all of
  # RFC1918 in every deployment that set it — unbounded, and the exact shape
  # tests/unit/test_architecture_no_private_destinations.py exists to catch.
  default:
    ipam:
      config:
        - subnet: ${E2E_NETWORK_SUBNET:-192.88.99.0/26}

volumes:
  creative_pg_data:
  # Destroyed and recreated by cleanup's `dc down -v` every run, so it persists
  # nothing across runs by design -- its job is to keep .tox OFF the bind mount,
  # not to cache anything.
  tox_data:
