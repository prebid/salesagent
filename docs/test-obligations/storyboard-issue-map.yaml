# Storyboard -> GitHub issue map (AdCP 3.1.1)
#
# THE ONE HAND-CURATED INPUT to scripts/audit/storyboard_roadmap.py.
# Everything else in that table is derived from the pinned compliance tree and
# this repo's .feature files. This file records the single thing a program
# cannot derive: whether an existing issue already tracks a storyboard's gap.
#
# WHY IT IS A FILE AND NOT 51 NEW ISSUES
# --------------------------------------
# The uncovered storyboards are a conformance gap, not a work plan. Turning
# each into a ticket unilaterally would assert a priority and a decomposition
# that belong to the project, not to this PR (#1247 is "gap analysis and
# roadmap", not "file the backlog"). This file lets the gap be published,
# reviewed, and mapped onto whatever roadmap the project already has.
#
# SCHEMA
#   <storyboard path relative to dist/compliance/<version>/>:
#     issues:   [int, ...]   open issues that track some or all of this gap
#     coverage: full | partial | none
#     note:     one line -- what the issues do NOT cover, when partial
#
# `coverage: none` with no issues is a legitimate, informative answer: it means
# "3.1.1 grades this, we do not test it, and nobody is tracking it." Those rows
# are the point of the document.
#
# RULES
#   * Every ON-PATH storyboard must appear here. The roadmap generator fails if
#     one is missing, so a spec bump cannot silently add an untracked gap.
#   * Issue numbers are claims about scope, not about status. A closed issue is
#     not an error here; it means the gap may now be covered -- re-check it.
#   * Do not add an issue number unless you have read the issue and it really
#     covers this storyboard's checks. A wrong mapping is worse than `none`:
#     it makes a gap look tracked.

