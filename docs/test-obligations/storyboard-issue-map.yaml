  universal/signed-requests.yaml:
    issues: [1291]
    coverage: partial
    # RETRACTION. This entry used to read: "the first real
    # in-network run disproved [the skip]: it grades them and they FAIL ... Not
    # advertising a capability does not exempt you from its storyboard." That
    # conclusion is wrong. The storyboard's gating clause — byte-identical at
    # 3.1.0 and 3.1.1 — says the opposite ("agents that do not advertise support
    # are not tested against this storyboard; absence of advertisement is not a
    # failure"), and @adcp/sdk@11.0.0 implements exactly it, as an implicit
    # request_signer requirement whose absence-skip semantics are deliberately
    # INVERTED from the general requires_capability rule
    # (dist/lib/testing/storyboard/runner.js checkRequires, citing
    # adcontextprotocol/adcp-client#1702).
    #
    # It grades us anyway because that gate no-ops when the runner could not
    # READ our capabilities, and our probe is rejected — the run's own first
    # step reports `signed_requests/get_capabilities (error) — VALIDATION_ERROR:
    # Unexpected keyword argument`. AdCP 3.1 composes core/version-envelope.json
    # into every request; our MCP tools are pydantic-validated on their
    # signatures before our code runs and declare neither envelope field. 31
    # graded checks in the 2026-08-12 in-network run fail the same way, all on
    # mcp:: (A2A reads a params dict and tolerates the extras).
    #
    # Nothing is owed upstream: the CLI threads the discovered profile correctly
    # (bin/adcp.js builds runOptions with no _client/_profile, so
    # runStoryboardBody discovers its own and hands it to checkRequires).
    note: >-
      #1291 is the implementation epic. MEASURED 2026-08-21
      (test-results/innet_210826_1048/, in-network, MCP pass): the 40 checks
      here are GRADED AND FAILING. They are not a conformance obligation --
      3.1.1 exempts agents that do not advertise request_signing.supported, and
      request_signing appears nowhere in src/ -- but they are collected anyway
      because the capability probe is REJECTED (#1512), which no-ops the skip
      gate. They are ledgered against #1291, which is open and owns the RFC 9421
      implementation, per this repo's known_failures.txt policy that signing
      entries are "regular shrinking genuine-gap entries tied to #1291".
      When #1546 lands the envelope fix, the gate closes and these 40 stop being
      COLLECTED rather than starting to pass -- remove them in that same change.
      A previous revision of this note claimed the 40 "are now gone" and that
      the roadmap dropped "from 80 checks to 48". That was measured against a
      branch carrying a production fix this PR reverts; on the reverted tree it
      is false. The roadmap reports 80 ledgered checks at the re-seeded head.
      The remaining gap here is the unwritten scenario, not a measured failure.

