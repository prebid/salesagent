# Named here rather than given a verdict, because a wireability verdict is a judgement
# about whether a step can be DRIVEN and OBSERVED from outside a running agent, and
# inventing one per step without reading the step would be worse than admitting the gap --
# which is exactly what this escape hatch is for. They leave this list by being assessed.
