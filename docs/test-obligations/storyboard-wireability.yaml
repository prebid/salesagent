# End-to-end wireability of the pinned conformance surface — AdCP 3.2.1
#
# CURATED INPUT, like storyboard-issue-map.yaml. Joined per (storyboard, step)
# into the check index; not derivable from the tree, because it is a
# judgement about whether a step can be DRIVEN and OBSERVED from outside a
# running agent.
#
# The question each verdict answers: can a BDD scenario for this step be wired
# in the e2e environment — every Given seeded by sending requests or by ordinary
# stack fixtures, the When constructed and sent by a client, every Then asserted
# on the wire?
#
#   wireable     — all three, no extra provisioning.
#   conditional  — all three reachable, but something must be provisioned first;
#                  `requires` names it (webhook_receiver, prior_state,
#                  seeded_account, signing_keypair, second_agent, ...).
#   not_wireable — a trigger that is not a client request at all, or an
#                  assertion invisible from outside (upstream traffic, logs).
#
# The harness IS a client: building an RFC 9421 signed request, sending a
# malformed or unauthenticated one, replaying an idempotency key or firing N
# requests to trip a rate limit are all client work and do NOT make a step
# unwireable. An earlier verdict set that treated them as unwireable was wrong
# and was corrected before this file was written.
#
# Steps requiring comply_test_controller are NOT listed here: they are
# ungradable by policy, so the index marks them not_wireable deterministically.
#
# Produced by a 42-agent assess+verify pass over the pinned steps; the
# adversarial pass corrected 11 verdicts, every one of them an over-conservative
# not_wireable that the evidence did not support. `evidence` quotes the step.
#
# `untriaged` is the escape hatch test_architecture_storyboard_wireability.py
# enforces: an on-path, non-controller-gated (storyboard, step) that AdCP grades
# us on must either carry a verdict in `steps` below or be named here, plainly
# admitting nobody has judged it yet. A step silently missing from both fails
# that guard, naming it — this file is not allowed to just fall behind the pin.

# ON-PATH ONLY SINCE THE 3.2.1 PIN, and plainly not yet judged. Every entry below
# arrived when the SDK pin moved 3.1.1 -> 3.2.1 (adcp 6.6.0 -> 9.0.0): 3.2 adds the
# buyer-selected-timezone phases to protocols/media-buy/index.yaml and brings
