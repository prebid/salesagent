[mypy]
# SQLAlchemy plugin for ORM type checking
plugins = sqlalchemy.ext.mypy.plugin, pydantic.mypy

# Python version
python_version = 3.12

# Strictness settings — left off as hard gates (ADR-009 / #1228 F2).
# Count-ratcheted via .mypy-untyped-defs-baseline (#1611): mypy --check-untyped-defs
# may not grow; flag stays False here so day-to-day `mypy` is unchanged.
# Caveat: counts drift with mypy/plugin versions — baseline ↑ needs review on bumps.
warn_return_any = False
warn_unused_configs = True
warn_unused_ignores = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False

# Be lenient with missing imports for third-party libraries
ignore_missing_imports = True

# Don't require explicit Optional for None defaults (common pattern)
no_implicit_optional = False

# Show error codes
show_error_codes = True
show_column_numbers = True
show_error_context = True

# Incremental mode for faster checking
incremental = True
cache_dir = .mypy_cache

# Exclude patterns
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^build/
    | ^dist/
    | ^\.git/
    | ^__pycache__/
    | \.pyc$
    | ^migrations/
  )

# Per-module settings
[mypy-tests.*]
# Be more lenient with test files
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-src.core.database.models]
# SQLAlchemy models - be lenient with model definitions
disallow_untyped_defs = False

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-googleads.*]
ignore_missing_imports = True

[mypy-google.ads.*]
ignore_missing_imports = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = False

[mypy-src.core.schemas_generated.*]
# Auto-generated schemas from AdCP JSON Schema
# These are generated by datamodel-codegen and may have type issues
ignore_errors = True

# accounts.py / capabilities.py: explicit Any erased the arm-mixing protection
# _FIELD_POLICY exists to prevent (handing one arm's function the other arm's
# entry). Binding, scoped to the modules this landed in (#1721 M3) -- repo-wide
# disallow_any_explicit is out of scope (thousands of pre-existing hits).
[mypy-src.core.tools.accounts]
disallow_any_explicit = True

[mypy-src.core.tools.capabilities]
disallow_any_explicit = True

# adapter_helpers.py: tenant params were bare Any (#1721 F5 -- salesagent-2bpt.5),
# a real DBTenant | TenantContext | Mapping[str, object] | None union exists and
# is used elsewhere; scoped like the accounts.py/capabilities.py entries above.
[mypy-src.core.helpers.adapter_helpers]
disallow_any_explicit = True
