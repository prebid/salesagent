[mypy]
# SQLAlchemy plugin for ORM type checking
plugins = sqlalchemy.ext.mypy.plugin, pydantic.mypy

# Python version
python_version = 3.12

# Strictness settings — left off as hard gates (ADR-009 / #1228 F2).
# Count-ratcheted via .mypy-untyped-defs-baseline (#1611): mypy --check-untyped-defs
# may not grow; flag stays False here so day-to-day `mypy` is unchanged.
# Caveat: counts drift with mypy/plugin versions — baseline ↑ needs review on bumps.
warn_return_any = False
warn_unused_configs = True
warn_unused_ignores = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False

# Be lenient with missing imports for third-party libraries
ignore_missing_imports = True

# Don't require explicit Optional for None defaults (common pattern)
no_implicit_optional = False

# Show error codes
show_error_codes = True
show_column_numbers = True
show_error_context = True

# Incremental mode for faster checking
incremental = True
cache_dir = .mypy_cache

# Exclude patterns
exclude = (?x)(
    ^\.venv/
    | ^venv/
    | ^build/
    | ^dist/
    | ^\.git/
    | ^__pycache__/
    | \.pyc$
    | ^migrations/
  )

# Per-module settings
[mypy-tests.*]
# Be more lenient with test files
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-src.core.database.models]
# SQLAlchemy models - be lenient with model definitions
disallow_untyped_defs = False

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-googleads.*]
ignore_missing_imports = True

[mypy-google.ads.*]
ignore_missing_imports = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = False

[mypy-src.core.schemas_generated.*]
# Auto-generated schemas from AdCP JSON Schema
# These are generated by datamodel-codegen and may have type issues
ignore_errors = True

# accounts.py / capabilities.py: explicit Any erased the arm-mixing protection
# _FIELD_POLICY exists to prevent (handing one arm's function the other arm's
# entry). Binding, scoped to the modules this landed in (#1721 M3) -- repo-wide
# disallow_any_explicit is out of scope (thousands of pre-existing hits).
[mypy-src.core.tools.accounts]
disallow_any_explicit = True

[mypy-src.core.tools.capabilities]
disallow_any_explicit = True
disallow_any_generics = True

# adapter_helpers.py: tenant params were bare Any (#1721 F5 -- salesagent-2bpt.5),
# a real DBTenant | TenantContext | Mapping[str, object] | None union exists and
# is used elsewhere; scoped like the accounts.py/capabilities.py entries above.
[mypy-src.core.helpers.adapter_helpers]
disallow_any_explicit = True

# The signing surface (#1757, salesagent-3ajkg.5 / control C3). Type discipline here rested on
# a reviewer objecting; a section is what replaces the reviewer. These five flags cost ZERO
# errors today — measured one at a time — so nothing is being cleaned up. What they remove is
# the ability to ADD an untyped def, an incomplete def, an untyped decorator, an implicit
# Optional, or an unchecked body to these modules.
#
# disallow_any_explicit is deliberately NOT here: it reports 8 errors on pydantic
# class-definition lines that no edit to the file can fix, and the floor would rise by one per
# new model, making Critical Pattern #1 unwritable on this surface. It and
# disallow_any_generics belong to salesagent-3ajkg.13.
[mypy-src.core.signing.*]
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
check_untyped_defs = True

[mypy-src.core.signing_contract.*]
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
check_untyped_defs = True

# VENDORED. signing_contract/_upstream holds upstream's code verbatim, so a rule we impose is a
# rule about someone else's file and the next re-vendor undoes the edit. The narrower wildcard
# wins over the one above.
[mypy-src.core.signing_contract._upstream.*]
disallow_any_generics = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
no_implicit_optional = False
check_untyped_defs = False

# #1879's second acceptance clause: strict scope INCLUDES capability_declarations. It appeared
# zero times in this file before now.
[mypy-src.core.schemas.capability_declarations]
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
check_untyped_defs = True

