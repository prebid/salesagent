[project]
name = "adcp-sales-agent"
version = "2.1.0"
description = "Prebid Sales Agent — AdCP-compliant MCP/A2A/REST server for ad inventory orchestration."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "a2wsgi>=1.10.0",
    "adcp==6.6.0",  # exact pin — 6.6.0 (latest stable); bump WIP, see docs/adcp-spec-version.md
    "fastmcp>=3.2.0,<3.3.0", # 3.3.0 split fastmcp-slim[server] from the monolith (breaking Context/Middleware imports); stay on 3.2.x
    "mcp>=1.28.1", # fixes CVE-2026-59950 / GHSA-vj7q-gjh5-988w
    "google-cloud-iam>=2.19.1",
    "rich>=13.7.1",
    "google-ads>=24.1.0",
    "requests>=2.33.0",
    "googleads==49.0.0",  # Pinned: library default sets GAM API version
    "flask>=3.1.3",
    "flask-caching>=2.3.0", # Response caching for improved performance
    "psycopg2-binary>=2.9.9",
    "authlib>=1.6.12",  # GHSA-jj8c-mmj3-mmgv; PYSEC-2026-188
    "requests-oauthlib>=1.3.1",
    "fastapi>=0.133.0",  # 0.133.0 adds starlette 1.0+ support (PYSEC-2026-161)
    "starlette>=1.0.1",  # PYSEC-2026-161 / CVE-2026-48710 (BadHost); explicit pin — fastapi allows 0.50.x
    "uvicorn>=0.23.0",
    "beautifulsoup4>=4.12.0",
    # aiohttp dropped (93a35c946): retry_utils imported it only for exception
    # types in a decorator with no callers, and all outbound HTTP now goes
    # through src/core/security/outbound_http.py. Nothing under src/ or tests/
    # imports it and nothing else in the lock depends on it, so the CVE floor
    # bumps on main (CVE-2026-34993 + CVE-2026-59881/69243/69244) are moot —
    # the package is no longer resolved at all. Import is banned by
    # ruff-egress.toml.
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    "watchdog>=6.0.0",
    "waitress>=3.0.0",
    "pytz>=2024.1",
    "httpx>=0.28.1",
    "idna>=3.7",  # explicit: src/vendor/adcp_canonical needs UTS-46 ToASCII (NOT str.encode('idna'), which is IDNA2003). Drops out with the vendored copy — see salesagent-3xcdk

    "a2a-cli>=0.2.0",
    "a2a-sdk[http-server]>=1.0.1", # a2a-sdk 1.0 (protobuf API, required by adcp>=4.3.0)
    "jinja2>=3.1.0",
    "prometheus-client>=0.23.1",
    "types-pytz>=2025.2.0.20250809",
    "markdown>=3.4.0",
    "types-Markdown>=3.4.2.10",
    "freezegun>=1.5.5",
    "babel>=2.17.0",
    "logfire>=4.16.0",
    "pydantic-ai-slim[google,openai,anthropic,cohere,mistral,groq]>=1.99.0",  # 1.99.0 fixes CVE-2026-46678 / GHSA-cqp8-fcvh-x7r3; use slim to avoid pydantic-ai meta-package pulling fastmcp>=3.3.0
    # Security patches for transitive dependencies
    "mcp>=1.28.1",  # CVE-2026-59950 / GHSA-vj7q-gjh5-988w (via fastmcp)
    "pyjwt>=2.13.0",  # GHSA-752w-5fwx-jx9f; PYSEC-2026-175/177/178/179
    "filelock>=3.20.3",  # GHSA-qmgc-5h2g-mvrw
    "urllib3>=2.7.0",  # GHSA-38jv-5279-wg99 + GHSA-qccp-gfcp-xxvc + GHSA-mf9v-mfxr-j63j
    "werkzeug>=3.1.6",  # GHSA-87hc-h4r5-73f7 + GHSA-29vq-49wr-vm6x
    "jaraco-context>=6.1.0",  # GHSA-58pv-8j8x-9vj2
    "cryptography>=50.0.0",  # GHSA-r6ph-v2qm-q3c2 + GHSA-p423-j2cm-9vmq + GHSA-g6cj-pr64-35w5/PYSEC-2026-3552 + CVE-2026-69247
    "pillow>=12.3.0",  # GHSA-cfh3-3jmp-rvhc + GHSA-whj4-6x5x-4v2j; PYSEC-2026-2253/2254/2255/2256/2257
    "python-multipart>=0.0.27",  # GHSA-wp53-j4wj-2cfg + GHSA-mj87-hwqh-73pj + GHSA-pp6c-gr5w-3c5g
    "pyasn1>=0.6.4",  # GHSA-jr27-m4p2-rc6r; PYSEC-2026-3455/3456/3457
    "mako>=1.3.12",  # GHSA-2h4p-vjrc-8xpq (transitive via alembic)
    "click>=8.3.3",  # PYSEC-2026-2132 (transitive via flask/uvicorn)
    # Transitive via pydantic-ai-slim -> genai-prices. 2.3.0 carries four advisories:
    # httpcore2 GHSA-7mj9-2mp8-4m2p, httpx2 GHSA-h4x7-gw46-3wm6 / GHSA-pf96-p4fj-6566 /
    # GHSA-8xx6-hgc6-gc2m. Floors are the highest fix version each names, so uv-secure
    # (the security-audit gate) has nothing left to report.
    "httpcore2>=2.10.0",  # GHSA-7mj9-2mp8-4m2p
    "httpx2>=2.12.0",  # GHSA-h4x7-gw46-3wm6 + GHSA-pf96-p4fj-6566 + GHSA-8xx6-hgc6-gc2m
]


# [project.optional-dependencies] removed in PR 2 of issue #1234.
# [dependency-groups].dev below is the single source of truth for dev deps.
# The ui-tests extras are preserved here as they serve a distinct purpose
# (Playwright-based UI test infra, not part of the standard dev workflow).
[project.optional-dependencies]
ui-tests = [
    "playwright==1.60.0",
    "pytest-playwright>=0.7.2",  # 0.6.x caps pytest<9.0.0; bump to allow pytest>=9.0.3 (GHSA-6w46-j5rx-g56g)
    "pytest-asyncio>=1.1.0",
    "allure-pytest==2.16.0",
]

[project.urls]
Homepage = "https://github.com/prebid/salesagent"
Repository = "https://github.com/prebid/salesagent"
Issues = "https://github.com/prebid/salesagent/issues"
Documentation = "https://github.com/prebid/salesagent/tree/main/docs"
Changelog = "https://github.com/prebid/salesagent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    # The structural-rule scanner `make quality-ci` runs over .ast-grep/rules/.
    # Declared here rather than left to a system install so `uv run ast-grep`
    # resolves to a pinned copy: a PATH lookup finds whatever version a developer
    # happens to have, and a CI runner has none at all.
    #
    # EXACT, not a floor. Whether a `# ast-grep-ignore:` directive still suppresses
    # when a reason follows the rule id changed between 0.41.1 and 0.45.3, and every
    # exemption in tests/ is written in the form the pinned version honours. A floor
    # would let CI resolve a version that silently un-suppresses all of them;
    # tests/unit/test_ast_grep_credential_header_ban.py grades the pin for that reason.
    "ast-grep-cli==0.45.3",
    "factory-boy>=3.3.0",
    "mypy>=1.18.2",
    "pytest>=9.0.3",  # GHSA-6w46-j5rx-g56g
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "pytest-timeout>=2.3.1",
    "ruff>=0.8.0",
    "jsonref>=1.1.0",
    "types-psycopg2>=2.9.21.20251012",
    "types-requests>=2.32.4.20250913",
    "types-pytz>=2025.2.0.20250809",
    "types-waitress>=3.0.1.20250801",
    "pytest-json-report>=1.5.0",
    "pytest-bdd>=7.0.0",
    "pytest-xdist>=3.5.0",  # bdd suite runs `pytest -n auto --dist loadfile`
    "semgrep>=1.50.0",
    "pylint>=4.0.5",
    # Security patches for transitive dev dependencies
    "black>=26.3.1",  # GHSA-3936-cmfr-pm3m
    "types-python-dateutil>=2.9.0.20260408",
    # Added in PR 2 of issue #1234: randomly for test order randomisation to
    # surface order-dependent failures. xdist floor kept at >=3.5.0 (union of
    # both sides; branch fix(test-infra) 45c310f3e). pytest-xdist is declared
    # once above next to pytest-bdd.
    "pytest-randomly>=3.15.0",
    # The hook runner itself. CONTRIBUTING.md and docs/development/ci-pipeline.md
    # both tell contributors to run `pre-commit install`, but it was never a
    # declared dependency -- it resolved only via `uvx`, i.e. from the network.
    # Floor is the pre-push stage requirement (docs/development/ci-pipeline.md).
    "pre-commit>=3.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    ".claude/worktrees",  # Agent worktrees have their own checkouts
    "src/vendor",  # Third-party source copied verbatim; we are forbidden from editing it, so linting it can only produce findings nobody may act on. Bounded by tests/unit/test_architecture_vendored_code.py
    "_build",
    "buck-out",
    "build",
    "dist",
    "alembic/versions",  # Never format migration files
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "C90",    # mccabe complexity
    "PLR",    # pylint refactor
    "TID251", # banned-api — enforce prohibited function usage
]
ignore = [
    # Policy: ADR-009 (#1228 F1). Do not add entries without a justification comment.
    # "Ratchet target" = follow-up count baseline (not this PR). "Permanently accepted" =
    # low-signal, no ceiling. "Boy-scout debt" = fix when touching.
    #
    # --- Ratchet targets (count-ratcheted via .ruff-complexity-baseline; ADR-009) ---
    "C901",    # complexity
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "F841",    # unused local variable — was a blanket keep until it hid a computed-then-dropped warning
    #
    # --- Permanently accepted (low-signal style; ADR-009) ---
    "PLR0911", # too-many-return-statements — guard-clause returns; low signal
    "PLR0913", # too-many-arguments — wide spec-mirroring signatures; low signal
    "PLR2004", # magic-value comparisons — inline constants often readable
    #
    # --- Justified keep / boy-scout debt (not gated; clean up when touching) ---
    "E501",    # Handled by ruff formatter; manual enforcement would conflict
    "E402",    # Flask app (admin_ui.py) requires imports after app config
    "E722",    # Bare excepts in error-recovery paths (adapters, auth) — prefer specific exceptions
    "F403",    # Star imports in __init__.py re-exports — prefer explicit imports when touching
    "F405",    # Consequence of F403
    "E741",    # Short `l` in math-heavy loops — renaming hurts readability
    "B904",    # raise-without-from in adapter error handling — add `from e` when touching
    "B027",    # Empty methods in BaseAdapter — intentional optional interface, not abstract
]


# Pin current ruff defaults so complexity counts in .ruff-complexity-baseline
# stay version-independent (ADR-009 / #1613). Absent → live count drifts on ruff bumps.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"inspect.getsource".msg = "inspect.getsource() is banned in tests. Write behavioral tests that exercise the actual code path instead of asserting strings exist in source code. See salesagent-gqzp."

[tool.ruff.lint.per-file-ignores]
# F821 is no longer ignored globally. It was, on the stated grounds of "false positives
# from conditional imports and TYPE_CHECKING blocks" -- but almost nothing it flagged was
# that. Turning it on surfaced 9 real undefined names under tests/, every one a latent
# NameError: a `logger` referenced by two except blocks that would have masked the very
# delete failure they report, an `AdCPSalesAgentError` raised but never imported, a
# `wire_absent` step helper never imported into two step modules, and three missing
# annotation imports. All nine are fixed rather than pinned.
#
# The ignore also cost a live bug: a `context` block edited into the wrong builder
# function referenced an undeclared name, ruff stayed silent, and it surfaced as four
# NameErrors only after a 25-minute in-network e2e run.
#
# The 9 remaining violations are all in src/ and are likewise NOT the documented false
# positive -- they are undefined names (`oauth_client_id`, `formats`, `_inspect`, ...)
# that look latent-real but sit in admin code this change does not touch. They are pinned
# per FILE so the rule stays live everywhere else and this list can only shrink.
# FIXME(#2099): investigate and remove these four entries.
"src/admin/blueprints/api.py" = ["F821"]
"src/admin/blueprints/products.py" = ["F821"]
"src/admin/tests/unit/test_auth.py" = ["F821"]
"src/core/schemas/__init__.py" = ["F821"]
"tests/*" = ["E722"]
"admin_ui.py" = ["E402", "E722"]

# ─── Coverage configuration ──────────────────────────────────────
[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.paths]
source = [
    "src/",
    ".tox/**/site-packages/",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "@abstract",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

# ─── Pylint configuration (used ONLY for R0801 duplicate-code detection) ──────
# General linting uses ruff. Pylint is invoked solely for its similarities
# checker, which has no equivalent in ruff.
[tool.pylint."messages control"]
disable = "all"
enable = "R0801"

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true
ignore-docstrings = true
ignore-comments = true
ignore-signatures = true
