# Egress import bans for the shipped tree (GH #1589).
#
# Run as its own quality line: `uv run ruff check --config ruff-egress.toml
# --no-respect-gitignore src/ scripts/` (see Makefile `quality` / `quality-ci`).
#
# Scope: `src/` and `scripts/` — the code this repo ships and operates with.
# `tests/` is deliberately out: tests import httpx/requests freely (TestClient,
# annotations, local origins); the seam architecture governs production egress,
# not test tooling. `alembic/` is deliberately out too: verified zero violations
# under this config and zero `src/` imports of it, and `ipaddress` has legitimate
# migration uses (CIDR columns), so extending there only invites false positives.
#
# `--no-respect-gitignore` is load-bearing, not decoration: ruff's directory walk
# honors `.gitignore`, which hid the git-tracked `scripts/ops/sync_all_tenants.py`
# from the scan (GH #1802 round-3 F2). The flag makes the walk indifferent to a
# later `.gitignore` edit re-opening that hole.
#
# Residual, accepted and named: a dynamic import (`importlib.import_module("httpx")`)
# evades this table. The threat model is honest drift, not an adversarial author —
# and no in-repo gate survives its own author. CLAUDE.md pattern #9 forbids adding
# a second RUNTIME egress mechanism to cover it.
#
# This table replaces the deleted AST scans #1 (raw network libs) and #2
# (SDK/MCP client constructors) of tests/unit/test_architecture_no_raw_egress.py.
# Non-vacuity is proven executable by tests/unit/test_ruff_egress_bans.py: every
# entry must fire on every resolving import spelling; and the set of SUPPRESSED
# violations is computed by ruff itself (`--ignore-noqa`), not by a regex that
# mirrors ruff's noqa syntax — so every suppression spelling ruff honors is
# visible to the proof by construction, and the exempt set is closed to the
# recorded constant there.
#
# Symbol bans enumerate EVERY resolving import path (banned-api matches the
# written path textually — a single-path ban is bypassable via re-exports).

[lint]
select = ["TID251", "ANN401"]

# ANN401 (`Any` in a signature) is scoped to the outbound chain, not all of src/.
#
# `Any` is not a type, it is an opt-out of type checking: assignable to and from
# everything by definition. So it is the one value the seam's own signatures
# CANNOT make unrepresentable. `send`/`asend` declare `json: JsonValue | None`,
# but a NEW forwarder declaring `json: Any` and passing it straight through
# type-checks clean, and mypy reports Success while a `datetime` reaches the
# wire (GH #1802 / GH #1802). That is the same defect pldmk.23 just
# removed from `VendorHttpClient.call` -- eliminated at every existing site,
# while remaining writable at the next one.
#
# The negated glob is what makes this a class-level ban rather than a list of
# known files: a forwarder added to a NEW module under either directory is
# covered on the day it is written. src/ as a whole is 209 violations and not
# this backstop's business; these two directories are 25.
# ---------------------------------------------------------------------------
# EXEMPTIONS LIVE HERE, and only here.
#
# The gate runs with `--ignore-noqa` (Makefile), which makes `# noqa` INERT for
# this config. That is the point: a file cannot exempt itself. The only way to
# be exempt is a row below, which lands in a reviewed diff instead of in a
# comment nobody sees.
#
# The cost, stated: these rows are FILE-granular where a noqa was line-granular.
# That is the trade for deleting the ~150 lines of machinery that used to audit
# whether every scattered noqa was recorded and still live — the audit is
# unnecessary once self-exemption is impossible rather than merely detectable
# (GH #1802).
#
# Rows only ever leave this list. Adding one is a review conversation.
# ---------------------------------------------------------------------------
[lint.per-file-ignores]
# ANN401 is scoped to the outbound chain, not all of src/.
"!{src/core/security,src/adapters}/**" = ["ANN401"]

# TID251 — the sanctioned importers of what the seam wraps. A seam architecture
# must have exactly these; the set is a floor, not debt.
"src/core/security/outbound_http.py" = ["TID251"]
"src/core/security/egress/policy.py" = ["TID251"]
"src/core/utils/mcp_client.py" = ["TID251"]

# TID251 — vendored third-party source (src/vendor/, see its __init__ and
# tests/unit/test_architecture_vendored_code.py). Copied upstream code, which this
# repo is forbidden to edit, so a finding here could never be acted on — the only
# available response would be this row.
#
# The one import it trips is `ipaddress` in adcp_canonical/_idna_canonicalize.py, and
# it is PARSING, not policy: `ipaddress.ip_address(host)` is used to RECOGNISE an IP
# literal so UTS-46/IDNA encoding is skipped for it (IDNA-2008 rejects purely-numeric
# labels), then returns `str(ip)` as the canonical spelling. No range set, no
# classification, no address decision, and nothing here dials — the module is a pure
# string->string host canonicalizer feeding identity comparison.
#
# That is materially different from what the ban below exists to stop: "a second range
# set added five CIDRs with no check going red". A second copy of address POLICY is the
# disease; recognising that "2001:db8::1" is not a domain name is not.
#
# This row leaves with the vendored copy (salesagent-3xcdk). It is scoped to the vendor
# subtree, so it cannot drift into first-party code.
"src/vendor/**" = ["TID251"]

# TID251 — scripts/ debt, NOT a seam. Retire these, do not grow them.
#   gen_test_tls.py      builds certificate IP SANs, not address classification
#   sync_all_tenants.py  ops-plane self-call to a hardcoded loopback URL; the
#                        seam refuses loopback by design, so routing it through
#                        the seam would be wrong rather than safer
"scripts/dev/gen_test_tls.py" = ["TID251"]
"scripts/ops/sync_all_tenants.py" = ["TID251"]

# ANN401 — `Any` that PREDATES the ban: **kwargs response stubs, -> Any decode
# returns, and genuinely dynamic logging/serializer inputs. Shrinks only.
"src/adapters/base_inventory.py" = ["ANN401"]
"src/adapters/broadstreet/client.py" = ["ANN401"]
"src/adapters/gam/managers/targeting.py" = ["ANN401"]
"src/adapters/gam/utils/error_handler.py" = ["ANN401"]
"src/adapters/gam/utils/formatters.py" = ["ANN401"]
"src/adapters/gam/utils/logging.py" = ["ANN401"]
"src/adapters/gam_orders_discovery.py" = ["ANN401"]
"src/adapters/xandr.py" = ["ANN401"]
"src/core/security/egress/response.py" = ["ANN401"]
"src/core/security/webhook_strict_json.py" = ["ANN401"]

[lint.flake8-tidy-imports.banned-api]
