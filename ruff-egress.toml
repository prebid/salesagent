"httpcore".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."
"urllib3".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."
"http.client".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."
"httpx2".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."
"httpcore2".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."

# Recorded non-additions (2026-08-31, GH #1802 round-3 F1). Deliberate, not
# oversight — re-argue before adding:
#   websockets                     — not HTTP-shaped; no feature uses it.
#   socket / asyncio.open_connection — raw TCP is not an honest-mistake path to
#                                    HTTP; `socket.gethostbyname` IS banned below
#                                    because resolve-then-check is.
#   ftplib / smtplib               — not HTTP.
#   xmlrpc.client                  — rides `http.client`, banned above.

