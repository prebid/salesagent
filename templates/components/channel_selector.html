<!-- Channel Selector Component

     Reusable multi-select advertising channel picker.

     Usage (in parent template):
     1. Set selected_channels variable before including
     2. Include this component

     Expects:
     - selected_channels: list of MediaChannel values (optional, defaults to empty)
     - media_channel_options: (value, label) pairs, injected for every template by the
       admin app's context processor from the AdCP MediaChannel enum. No channel literal
       lives in this file, so the picker cannot offer a value the enum does not have.
-->

{% set selected = selected_channels if selected_channels is defined else [] %}

<select id="channels" name="channels" multiple aria-describedby="channels-hint" style="height: 150px; width: 100%;">
    {% for value, label in media_channel_options %}
    <option value="{{ value }}" {% if value in selected %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
</select>
<small id="channels-hint" style="color: #666;">Hold Ctrl/Cmd to select multiple channels. Leave empty to use adapter defaults.</small>
