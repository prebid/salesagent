[tox]
requires =
    tox>=4.24
    tox-uv>=1.20
# coverage env excluded from parallel runs — invoked separately by run_all_tests.sh
env_list = unit, integration, e2e, admin, bdd, ui, quality, storyboard, collection
skip_missing_interpreters = true

# ─── Base test environment ───────────────────────────────────────
[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
package = editable
pass_env =
    DATABASE_URL
    ADCP_SALES_PORT
    POSTGRES_PORT
    GEMINI_API_KEY
    ENCRYPTION_KEY
    ADCP_TESTING
    CREATE_SAMPLE_DATA
    CREATE_DEMO_TENANT
    DELIVERY_WEBHOOK_INTERVAL
    ADCP_WEBHOOK_BREAKER_TIMEOUT_SECONDS
    COMPOSE_PROJECT_NAME
    SUPER_ADMIN_EMAILS
    GOOGLE_CLIENT_ID
    GOOGLE_CLIENT_SECRET
    PYTEST_CURRENT_TEST
    BDD_E2E_ENABLED
    E2E_BASE_URL
    E2E_POSTGRES_URL
    E2E_DATABASE_URL
    E2E_PER_WORKER
    # The TLS listener's origin and the CA that signed its leaf (salesagent-tgzb).
    # Without these two lines the vars never reach pytest and the https tests
    # cannot tell "no TLS listener" from "not passed through".
    E2E_TLS_BASE_URL
    E2E_CA_BUNDLE
    # The network slice this stack was allocated (salesagent-mp53.9). Exactly the
    # same trap as the two lines above, one hop further out: getting it into the
    # container's `environment:` is NOT enough, because tox filters the env it
    # hands pytest. Without this line the value is set on the host, set in the
    # container, and STILL invisible to the test — which then cannot tell "the
    # subnet was never allocated" from "it was allocated and not passed through".
    E2E_NETWORK_SUBNET
    ADCP_TLS_PORT
    ADCP_TEST_HOST
    ADCP_TEST_DB_HOST
    ADCP_TEST_DB_PORT
    # webhook-capture's plain-HTTP readback control-plane (salesagent-amht.3).
    # Without these two, host-run readback silently falls back to a
    # compiled-in default port instead of the actually-allocated one.
    WEBHOOK_CAPTURE_HOST
    WEBHOOK_CAPTURE_PORT
    # ADCP_WEBHOOK_HOST is retired as a COMPOSE-SERVICE variable — the e2e stack
    # must never set it again (tests/unit/test_architecture_e2e_compose_tls_origins.py
    # enforces that). It survives here purely as a forwarding declaration, because
    # the storyboard runner still reads it as the callback host the server must
    # dial back on (_WEBHOOK_CALLBACK_HOST_ENV in
    # tests/storyboard/test_storyboard_conformance.py). Forwarding an unset var
    # is a no-op, so this cannot resurrect the mechanism the guard forbids.
    ADCP_WEBHOOK_HOST
    # The TLS front the storyboard runner's webhook receiver is published behind
    # (host suffix + port). Replaces the retired plaintext ADCP_WEBHOOK_HOST path:
    # the advertised callback is https at tls-proxy, never http at a service name.
    STORYBOARD_WEBHOOK_TLS_FRONT
    STORYBOARD_AGENT_URL_MCP
    STORYBOARD_AGENT_URL_A2A
    STORYBOARD_WEBHOOK_PORT
    # The key-encryption key the storyboard seeder MINTS the tenant's signing key
    # under, and the name of the variable holding it. Same trap as E2E_CA_BUNDLE and
    # E2E_NETWORK_SUBNET above: docker-compose.e2e.yml sets both on the tests service,
    # and without these lines tox filters them out of the env it hands `commands_pre`.
    # Measured consequence: `_mint_tenant_signing_key` raised AdCPConfigurationError
    # (no KEK), the tenant published an EMPTY JWKS, and webhook_emission's
    # `assert_webhook_signing_key_present` failed for a fixture reason on both
    # protocols (run innet_200926_0635).
    ADCP_SIGNING_KEY_PASSPHRASE_ENV
    ADCP_SIGNING_DEV_KEK
    PLAYWRIGHT_BROWSERS_PATH
    PYTEST_XDIST_AUTO_NUM_WORKERS
    BDD_XDIST_N
    BDD_E2E_XDIST_N
    UNIT_XDIST_N
    UNIT_DIST
    PYTEST_COLLECTION_MANIFEST
    BDD_LIVENESS_SESSIONS
    INTEGRATION_XDIST_N
    TEST_DB_TEMPLATE
    TEST_DB_SKIP_DROP
    CREATIVE_AGENT_URL
    CREATIVE_AGENT_PORT
    ALLOW_LIVE_CREATIVE_AGENT
    PYTHONPYCACHEPREFIX
    BDD_SHARD_PATHS_1
    BDD_SHARD_PATHS_2
    BDD_SHARD_PATHS_3
    BDD_SHARD_PATHS_4
    BDD_SHARD_XDIST_N
    # Outbound egress escape hatch — TEST PATH ONLY. Forwarded, never set here:
    # setenv would force it open for EVERY tox env, including the in-process
    # refusal tests that must see it closed. Passing it through lets
    # docker-compose.e2e.yml open it for the containerised runner, and lets a
    # HOST run inherit it from the ambient environment when it provides it.
    # The host path needs that: run_all_tests_host.sh exports
    # CREATIVE_AGENT_URL=https://agent.localhost:<port>/... (scripts/creative-agent-stack.sh),
    # an https URL at a reserved loopback ADDRESS that
    # src/core/security/outbound_http.py refuses without this hatch. There is
    # no scheme hatch anymore (salesagent-e6h0 deleted it) — every outbound
    # origin is TLS-fronted, so only the address gate is left to relax.
    # SSL_CERT_FILE travels the same path for the same reason: the host-run
    # process needs to trust the generated CA to dial those https fronts.
    # Consequence wherever ADCP_OUTBOUND_ALLOW_PRIVATE IS set: no suite that
    # inherits it can grade a private-range refusal, because the seam then
    # accepts the addresses it exists to reject. Refusal grading stays
    # in-process, where set_flags() in tests/integration/test_outbound_http.py
    # monkeypatches it to the literal "false" per case and is therefore immune
    # to the ambient value.
    ADCP_OUTBOUND_ALLOW_PRIVATE
    SSL_CERT_FILE
    # ADCP_OUTBOUND_BACKOFF_BASE_SECONDS is deliberately NOT passed. It shortens
    # production's BR-RULE-029 backoff for test speed, so the tests that want it
    # set it per case (fast_backoff() in tests/integration/test_outbound_http.py);
    # a suite-wide value would silently shorten the schedule everywhere else too.
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}

# ─── Unit tests (DATABASE_URL must be UNSET) ────────────────────
[testenv:unit]
description = Unit tests (no database, no server)
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    DATABASE_URL =
commands =
    pytest tests/unit/ tests/harness/ \
        -n {env:UNIT_XDIST_N:auto} --dist {env:UNIT_DIST:loadgroup} \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/unit.json --json-report-indent=2 \
        -q --tb=line {posargs}

# ─── Integration tests ──────────────────────────────────────────
[testenv:integration]
description = Integration tests (needs PostgreSQL)
commands =
    pytest tests/integration/ \
        -n {env:INTEGRATION_XDIST_N:0} --dist {env:INTEGRATION_DIST:loadfile} \
        -m "not skip_ci" \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/integration.json --json-report-indent=2 \
        -p no:randomly \
        -q --tb=line {posargs}

# ─── E2E tests ──────────────────────────────────────────────────
[testenv:e2e]
description = End-to-end tests (needs full Docker stack)
# E2E talks to the SERVER's database (/adcp), not the suite DB (/adcp_test). In
# the in-network runner the server DB lives at postgres:5432/adcp, exported as
# E2E_DATABASE_URL; on the host path E2E_DATABASE_URL is unset and we keep the
# inherited DATABASE_URL the e2e stack already provides. Per-suite override so
# integration/bdd/admin (which share this runner) still see /adcp_test.
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    DATABASE_URL = {env:E2E_DATABASE_URL:{env:DATABASE_URL:}}
commands =
    pytest tests/e2e/ \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/e2e.json --json-report-indent=2 \
        -q --tb=line {posargs}

# ─── Admin UI tests ──────────────────────────────────────────────
[testenv:admin]
description = Admin UI tests (needs full Docker stack)
commands =
    pytest tests/admin/ \
        -m "not slow" \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/admin.json --json-report-indent=2 \
        -q --tb=line {posargs}

# ─── UI smoke tests (Playwright) ───────────────────────────────
# ─── Server-DB suites must NOT run concurrently ──────────────────
# e2e, ui, bdd and bdd_e2e all point DATABASE_URL at the SERVER's database
# (/adcp) rather than the suite DB (/adcp_test), and all three MUTATE it:
#   e2e      seeds ci-test/iso-test (scripts/setup/init_database_ci.py)
#   ui       seeds the default tenant + one gam_inventory row
#   bdd      TRUNCATEs EVERY table before each e2e_rest scenario
#            (tests/bdd/conftest.py _reset_e2e_db)
# Under `tox -p` they were scheduled in parallel, so bdd's truncations landed
# inside e2e's window and deleted the tenants e2e had just seeded. Measured:
# 516 e2e_rest scenarios executed across bdd's ~23min, against e2e's ~67s --
# a collision was not a risk, it was a certainty. It presented as
# "Tenant with subdomain 'ci-test' not found ... did the seed run?" (the seed
# HAD run) plus AUTH_INVALID on tenant-isolation, and it was invisible to a
# targeted run: the same three tests pass alone.
#
# `depends` orders envs under `-p`, so this serializes only the server-DB
# group; unit/integration/admin still run fully parallel. Cost is ~2min on a
# ~23min critical path, because bdd dominates either way. The alternative --
# per-suite server stacks -- already exists behind E2E_WORKERS in
# run_all_tests.sh, but it is off by default and this must be correct by
# default.
#
# The bdd env comment below already noted the same hazard WITHIN bdd (xdist
# workers racing on one Postgres) and fixed it by going serial. This is that
# same defect one level up, across suites.
[testenv:ui]
description = UI smoke tests via Playwright (needs full Docker stack + browser)
depends = e2e
extras = ui-tests
# UI drives the browser against the running server and seeds the SERVER's
# database (/adcp) — same per-suite DB split as e2e. In-network the browser
# binary is pre-baked (PLAYWRIGHT_BROWSERS_PATH); commands_pre is then a no-op.
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    DATABASE_URL = {env:E2E_DATABASE_URL:{env:DATABASE_URL:}}
commands_pre =
    playwright install chromium
# --output is NOT cosmetic. pytest-playwright defaults it to `test-results`,
# relative to cwd (/app), and registers a session-scoped autouse fixture
# `delete_output_dir` that shutil.rmtree()s that whole directory when the ui
# session starts. That is the SAME directory run_all_tests.sh uses for
# $RESULTS_DIR, so ui was deleting the in-flight results of every suite that
# finished before it -- and `depends = e2e` guarantees unit, admin and e2e all
# do. Measured: the results dir's Birth timestamp equals the ui session start.
# Per-suite JSON reports survive because they are written to {toxworkdir} and copied
# in AFTER tox exits; the collection and liveness records the `collection` env reads
# are written into $RESULTS_DIR *during* the run, and would not.
# This is the defect run_all_tests.sh:405-410 already works around blind, with
# its second `mkdir -p` "insurance against $RESULTS_DIR having been removed".
commands =
    pytest tests/ui/ \
        --browser chromium \
        --output={envtmpdir}/playwright-artifacts \
        --json-report --json-report-file={toxworkdir}/ui.json --json-report-indent=2 \
        -q --tb=short {posargs}

# ─── Ratchet baselines too slow for the unit suite ─────────────
[testenv:quality]
description = Ratchets whose counters are too slow for tests/unit (mypy --check-untyped-defs, pylint R0801)
# No database and no server: both counters are static analysis over the tree.
# Runs in parallel with the other suites under `tox -p`; the gate's critical
# path is bdd_inprocess (~12m40s) and this measures ~12m, so it costs no
# additional wall-clock. Exists because these ratchets were enforced NOWHERE:
# their pre-commit hooks are stages:[pre-push] and this repo never pushes
# (salesagent-aemue.13).
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    DATABASE_URL =
commands =
    pytest tests/quality/ \
        --json-report --json-report-file={toxworkdir}/quality.json --json-report-indent=2 \
        -q --tb=short {posargs}

# ─── BDD behavioral tests ──────────────────────────────────────
[testenv:bdd]
description = BDD behavioral tests (pytest-bdd; xdist on host, serial in-network)
# Runs after e2e and ui: it TRUNCATEs the shared server DB (see the banner above).
depends = e2e, ui
# Worker count is env-controlled. Host: BDD_XDIST_N unset -> "auto" (parallel).
# In-network: BDD_XDIST_N=0 -> truly serial, no xdist subprocess. Required because
# (a) all bdd workers share ONE live Postgres in e2e mode (xdist races on it), and
# (b) under xdist the BDD_E2E_ENABLED env doesn't reach the worker's
# pytest_generate_tests, so the e2e_rest transport is silently dropped.
# -n0 runs collection in-process, so e2e_rest is parametrized and there's no race.
setenv =
    {[testenv]setenv}
    BDD_PAYLOAD_ARTIFACT = {toxworkdir}/bdd_payloads.json
commands =
    pytest tests/bdd/ \
        -n {env:BDD_XDIST_N:auto} --dist {env:BDD_DIST:loadfile} \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/bdd.json --json-report-indent=2 \
        -q --tb=line {posargs}

# ─── BDD two-pass split (fast full runs) ────────────────────────
# The full `bdd` env above runs all transports serially (required when e2e_rest
# is on). For fast runs, run_all_tests.sh expands `bdd` -> `bdd-inprocess-s*,bdd_e2e`
# so the in-process bulk parallelizes and only e2e_rest stays on the shared server.
# SHARDED, and the hyphens are load-bearing. Under xdist every worker collects
# the WHOLE suite and then runs a slice of it, so collection costs O(items x
# workers): measured at 7223 items x 16 workers, 162.5 s per worker just to
# collect, against 57.9 s to import. Each shard collects only its own files, so
# collection divides instead of repeating. One env per SHARD_COUNTS["bdd"], which
# test_run_all_tests_contract.py holds this header to.
#
# tox factors split on `-`, NOT `_`. With [testenv:bdd_inprocess_s{1,2,3,4}] the
# `s1:` prefix silently never fires: BDD_SHARD_PATHS resolves to None, tox drops
# the empty value from argv, pytest falls back to pytest.ini's `testpaths =
# tests` and collects the entire tree -- exit 0, "congratulations". Verified
# against tox 4.49.1. Do not rename these envs to underscores.
#
# BDD_SHARD_PATHS and BDD_SHARD_XDIST_N carry no `{env:...:default}` fallback ON
# PURPOSE, but that does NOT make an unset value fail -- tox resolves it to empty
# and drops it. run_all_tests.sh asserts both with `${VAR:?}` after exporting
# them; the safety lives in the shell because tox will not provide it.
#
# --dist is literal: BDD_DIST is set in docker-compose.e2e.yml but was never in
# pass_env, so the env-lookup wrapper this line used to carry always resolved to
# its own default anyway. A knob that never reached tox is not a knob.
[testenv:bdd-inprocess-s{1,2,3,4}]
description = BDD in-process transports (a2a/mcp/rest), one shard of the suite
setenv =
    {[testenv]setenv}
    BDD_E2E_ENABLED = false
    s1: BDD_SHARD_PATHS = {env:BDD_SHARD_PATHS_1}
    s2: BDD_SHARD_PATHS = {env:BDD_SHARD_PATHS_2}
    s3: BDD_SHARD_PATHS = {env:BDD_SHARD_PATHS_3}
    s4: BDD_SHARD_PATHS = {env:BDD_SHARD_PATHS_4}
    # The dispatched-request payload artifact (tests/bdd/payload_capture.py), beside
    # the JSON report and named after the same env. Under {toxworkdir}, NOT at the
    # test-results/ root the way bdd_scenario_liveness.json lands: that file is
    # overwritten every run, and this gate's whole subject is the difference between
    # a "before" and an "after". scripts/ci/merge_shard_reports.py folds the shards'
    # into the one bdd_inprocess artifact compare_payloads reads.
    BDD_PAYLOAD_ARTIFACT = {toxworkdir}/{envname}_payloads.json
    # A shard is a measurement of PART of the suite, so it must not land on the shared
    # top-level path the unit env reads: the same two-writers defect the bdd_e2e env
    # below closes for itself. load_run folds the per-session copies instead.
    BDD_LIVENESS_ARTIFACT = {toxworkdir}/{envname}_scenario_liveness.json
commands =
    pytest {env:BDD_SHARD_PATHS} \
        -n {env:BDD_SHARD_XDIST_N} --dist load \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/{envname}.json --json-report-indent=2 \
        -q --tb=line {posargs}

# In-network transports only (real HTTP -> nginx -> live server): e2e_rest, e2e_mcp
# and e2e_a2a for the AdCP tool surfaces, e2e_admin for the admin UI scenarios
# (salesagent-jckl). The
# -k must name EVERY in-network id: an id matching neither selector is collected by
# no env in the run_all_tests.sh split and dies dormant while CI stays green.
# e2e_mcp and e2e_a2a were added to that list the same commit the conftest began
# parametrizing them (salesagent-e0enw) — their dispatchers had existed since #1858
# with nothing naming them, which is the dormancy this comment warns about.
# Serial for now (one shared server + /adcp DB); goes parallel via BDD_E2E_XDIST_N
# once per-worker server stacks land and the xdist guard is relaxed.
[testenv:bdd_e2e]
description = BDD in-network transports only (real HTTP to the live server)
# Same shared-server-DB truncation as bdd (see the banner above the ui env), and
# e2e_admin mutates that same server DB through the admin UI.
depends = e2e, ui
setenv =
    {[testenv]setenv}
    BDD_E2E_ENABLED = true
    BDD_PAYLOAD_ARTIFACT = {toxworkdir}/bdd_e2e_payloads.json
    # This env is -k NARROWED, and the liveness artifact is a measurement OF A SCOPE.
    # Left at its default it lands on test-results/bdd_scenario_liveness.json — the
    # shared top-level path the full-scope bdd/bdd_inprocess run writes and the unit
    # env reads — so under `tox -p` whichever finished last won, and nine storyboard
    # guards refused with "written by a NARROWED bdd run" or passed purely on
    # scheduling order. The guards are right to refuse a number from the wrong scope;
    # the defect was two writers sharing one path. Its own name here, under
    # {toxworkdir} like the payload artifact above, is what makes the full-scope file
    # unshadowable — and what makes a bdd_e2e-only run unable to turn those guards red.
    BDD_LIVENESS_ARTIFACT = {toxworkdir}/bdd_e2e_scenario_liveness.json
commands =
    pytest tests/bdd/ -k "e2e_rest or e2e_mcp or e2e_a2a or e2e_admin" \
        -n {env:BDD_E2E_XDIST_N:0} \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/bdd_e2e.json --json-report-indent=2 \
        -q --tb=line {posargs}

# ─── Collection observers ───────────────────────────────────────
# Tests that observe what a real run COLLECTED, rather than re-collecting it in
# a subprocess of their own. They read the artifact tests/_collection_manifest.py
# publishes, so they must run after a session that wrote one.
#
# `depends` names both BDD paths deliberately. run_all_tests.sh expands `bdd`
# into `bdd-inprocess-s*` + `bdd_e2e` only when E2E_WORKERS>0; on the plain path
# (laptops, small runners) the single `bdd` env is what produces the record.
# Naming an env that is absent from a given run orders nothing and is not an
# error, so one list covers both.
[testenv:collection]
description = Observers of what the real run collected (needs a prior BDD session)
depends = bdd, bdd-inprocess-s{1,2,3,4}, bdd_e2e
commands =
    pytest tests/collection/ \
        --cov=src --cov-report= \
        --json-report --json-report-file={toxworkdir}/collection.json --json-report-indent=2 \
        -q --tb=short {posargs}

# ─── AdCP storyboard conformance ────────────────────────────────
[testenv:storyboard]
description = AdCP storyboard-conformance grading via the real @adcp/sdk runner (needs full Docker stack)
# Runs after the other stack-dependent suites, for the reason bdd states above: they
# share ONE live server and ONE /adcp database, and this suite drives real create/update
# traffic through it. Overlapping bdd_e2e with it would let each suite's writes appear as
# the other's state, and a race read as a conformance failure.
depends = e2e, ui, bdd, bdd_e2e
# Runs IN-NETWORK like every other stack-dependent suite, but against its OWN agent:
# adcp-server-storyboard, which is adcp-server's anchored configuration with
# ENVIRONMENT=production. A conformance storyboard grades a DEPLOYED seller, and a
# deployed seller runs the production boundary; the shared adcp-server stays on
# development strictness because bdd_e2e/e2e/admin are about that.
#
# BOTH protocols are reached at ONE origin -- storyboard.adcp.test:8443, the tls-proxy
# alias in front of that service -- because proving the two surfaces agree is the only
# thing grading both buys, and two axes on two origins compare nothing. A2A additionally
# REQUIRES the real scheme: it is card-first, and the card publishes https for any
# non-loopback host, so dialed plaintext it advertised TLS against a plaintext port and
# every card-derived call failed. No host ports, so no collision surface and no ports
# overlay (docker-compose.e2e.ports.yml says not to add one here).
# STORYBOARD_AGENT_URL_{MCP,A2A} are passenv-only: the defaults live in
# tests/storyboard/test_storyboard_conformance.py, once, and
# tests/unit/test_storyboard_both_protocols_one_origin.py pins them to one origin.
#
# The compliance/schema bundle is a pinned GitHub release asset with no default
# — it must be downloaded before this env runs (CI does it via
# .github/actions/_adcp-bundle; locally, run that action's two commands). Paths are
# repo-root-relative and resolved as such by the test module.
#
# STORYBOARD_AUTH_TOKEN's default below is a LITERAL COPY of
# scripts/setup/init_database_ci.py's STORYBOARD_TOKEN, which owns the value and is what
# makes it resolvable in the database. An ini file cannot import a Python constant, so
# this copy has to exist and has to be kept in step by hand -- every other spelling of
# the token now reads the constant. The seeded token and this default disagreeing is a
# 401 on every credentialed storyboard step, so change both or neither. (The module's
# own fallback, used when this variable is unset, already reads the constant.)
#
# NOT the CI token: the storyboard has its own tenant, because the agent card publishes a
# tenant's stored host and the two agent fronts in the e2e stack are different hosts. A
# principal belongs to exactly one tenant, so the token moves with the tenant.
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
    STORYBOARD_AUTH_TOKEN = {env:STORYBOARD_AUTH_TOKEN:storyboard-test-token}
    STORYBOARD_COMPLIANCE_DIR = {env:STORYBOARD_COMPLIANCE_DIR:}
    STORYBOARD_SCHEMA_ROOT = {env:STORYBOARD_SCHEMA_ROOT:}
    # The SERVER's database, the same override e2e and ui take. The tests container
    # inherits DATABASE_URL=.../adcp_test (the suite DB) while every stack service runs
    # on .../adcp, so the seed in commands_pre would otherwise write a tenant into a
    # database no server reads -- a fix that changes nothing. On the host path
    # E2E_DATABASE_URL is unset and the inherited value is already the stack's.
    DATABASE_URL = {env:E2E_DATABASE_URL:{env:DATABASE_URL:}}
# Same shape as the ui env's `playwright install`: idempotent, and cheap when the
# host has already populated node_modules over the bind mount. Unlike playwright,
# npm is not a venv entry point, so tox needs it allowlisted explicitly.
allowlist_externals =
    npm
# SEEDS ITS OWN TENANT. The runner authenticates as STORYBOARD_AUTH_TOKEN below --
# the token `seed_storyboard_tenant` attaches to the storyboard tenant's own principal --
# and the credential lookup is scoped by tenant_id, so that tenant has to exist with that
# principal attached or every credentialed step is a 401. It is NOT the CI tenant: a
# principal of another tenant resolves to nothing here, and an account grant naming it
# cannot satisfy the (tenant_id, principal_id) foreign key.
#
# ``depends`` above does NOT arrange that. It orders envs only among the ones a given
# invocation SELECTED, and ``run_all_tests.sh`` runs ``tox -p -e "$SUITES"`` -- so in a
# full run e2e happens to seed `ci-test` first and this suite inherits it, while in a
# one-suite run (``./run_all_tests.sh storyboard``, which is exactly what the CI job
# runs) nothing seeds it and all 26 credentialed checks 401. That is the whole of why
# this suite scored 30/21 per protocol on a full box run and reached no verdict in CI.
#
# Seeding here is idempotent -- init_database_ci re-points an existing principal rather
# than failing (scripts/setup/init_database_ci.py) -- so a full run is unaffected and a
# one-suite run stops depending on a neighbour having been selected.
# THEN the storyboard's OWN tenant, seeded here and only here, AFTER the bundle is on
# disk. It needs the pinned bundle's own test kit (test-kits/acme-outdoor.yaml) for the
# inventory media_buy_seller/inventory_list_* grades, and init_database_ci cannot read it:
# that script also runs inside the server image, where the bundle is gitignored and absent.
# Running it from the tests container, after npm ci and the _adcp-bundle action, is what
# lets it REFUSE on a missing bundle instead of quietly seeding a tenant with no
# inventory — the same posture the suite's own _bundle_gate takes. It owns the Host the
# runner dials and the STORYBOARD_AUTH_TOKEN principal, so it precedes the step below.
#
# THEN that tenant's request-signing state: the posture the negative vectors are graded
# against, the counterparty principal a verified runner signature resolves to, and the
# published signing key the webhook grades read (scripts/setup/storyboard_signing.py).
# Last, because it mutates the tenant the line above creates.
#
# It runs HERE rather than in init_database_ci because it is not neutral for the other
# suites: `required_for` changes what an unauthenticated create_media_buy is answered.
# `depends` above orders e2e/ui/bdd/bdd_e2e ahead of this env, so in a full run they are
# finished before it applies; in a one-suite run there is nothing else to affect.
#
# The DEPLOYMENT half of the same contract cannot be seeded here at all — the counterparty
# registry, the revocation list and the two override maps are read by the server process
# from its environment at boot, so they are exported at stack bring-up by
# scripts/dev/storyboard-signing-env.sh.
commands_pre =
    npm --prefix tests/storyboard/runner ci --no-audit --no-fund
    python -m scripts.setup.init_database_ci
    python -m scripts.setup.seed_storyboard_tenant
    python -m scripts.setup.storyboard_signing
commands =
    pytest tests/storyboard/ \
        --json-report --json-report-file={toxworkdir}/storyboard.json --json-report-indent=2 \
        -rs -q --tb=short {posargs}

# ─── Coverage combine + report ──────────────────────────────────
[testenv:coverage]
description = Combine coverage from all suites and generate reports
skip_install = true
deps = coverage[toml]
depends = unit, integration, e2e, admin, bdd
parallel_show_output = true
allowlist_externals =
    bash
setenv =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    bash {toxinidir}/scripts/ci/coverage_report.sh
    coverage html -d {toxinidir}/htmlcov
    coverage json -o {toxinidir}/coverage.json
